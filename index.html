#cgp-gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:var(--bg);color:var(--ink);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;font-family:var(--f-body);font-size:15px;line-height:1.45}

<style>

}

<script>(function(){
  'use strict';
  /* Trạng thái giấy phép — chép đúng tt() của app Quản Trị và conHan() của Firestore Rules:
     khoá (active:false) · vĩnh viễn · chưa đặt hạn / hạn sai kiểu · hết hạn · dùng thử · đã trả tiền.
     l = { active, vinhVien, han (mili-giây | null), trial, sai } ; now = giờ dùng để xét (đã chống vặn lùi). */
  var N=864e5;
  function trangThai(l,now){
    if(!l) return {ma:'chua'};
    if(l.active===false) return {ma:'khoa'};
    if(l.vinhVien===true) return {ma:'vv'};
    var h=(typeof l.han==='number'&&isFinite(l.han))?l.han:null;
    if(h==null) return {ma:l.sai?'sai':'trong'};
    var d0=new Date(now); d0.setHours(0,0,0,0);
    var con=Math.floor((h-d0.getTime())/N);
    if(h<=now) return {ma:'het',con:con,han:h};
    return {ma:l.trial===true?'thu':'tra',con:con,han:h};
  }
  function con(st){ return !!st&&(st.ma==='vv'||st.ma==='tra'||st.ma==='thu'||st.ma==='admin'); }
  window.CGP_ST={trangThai:trangThai,con:con};
  /* MỞ NHANH: máy đã có giấy phép còn hạn của lần trước (đúng tài khoản, máy chủ xác nhận trong 7 ngày,
     giờ máy không bị vặn lùi) ⇒ mở app ngay, không chờ mạng. Firebase nạp xong sẽ kiểm lại — hết hạn / bị khoá là che lại. */
  try{
    var g=JSON.parse(localStorage.getItem('cgp_gp_v1')||'null');
    if(g&&g.uid){
      var ver=Number(g.ver)||0, now=Math.max(Date.now(),ver);
      if(Date.now()>=ver-2*3600e3 && now-(Number(g.ok)||0)<=7*N){
        var st=g.admin?{ma:'admin'}:trangThai(g.l,now);
        if(con(st)){ document.getElementById('cgp-gate').className=''; window.__cgpMoNhanh=g.uid; }
      }
    }
  }catch(e){}
  /* Thư viện không nạp được (lần đầu mở mà mất mạng) ⇒ đừng để màn "Đang mở…" đứng mãi */
  setTimeout(function(){
    if(window.__cgpChay) return;
    var gt=document.getElementById('cgp-gate'), b=document.getElementById('cgp-body');
    if(!gt||!b||gt.className!=='cgp-on'||!/Đang mở/.test(b.textContent||'')) return;
    b.innerHTML='<div class="cgp-bao v">Chưa tải được phần đăng nhập — máy đang mất mạng hoặc mạng yếu.<br>Nối mạng rồi bấm <b>Thử lại</b>. Lần đầu dùng cần có mạng; sau đó mất mạng vẫn cân được.</div>'
      +'<button class="cgp-b pri" type="button" onclick="location.reload()">Thử lại</button>'
      +'<p class="cgp-hint" style="text-align:center">Cần hỗ trợ: <a href="tel:0977823979">📞 0977 823 979</a></p>';
  },15000);
})();</script>

<script>
'use strict';
/* ===CORE-START=== (phần tính toán thuần — mọi khối lượng lưu bằng gam, bội số 10 g) */
function R10(g){return Math.round(g/10)*10}
function roundStep(v,s){s=s||1;return Math.round(v/s)*s}
function parseKg(s){if(s==null)return 0;s=String(s).trim().replace(/\s/g,'').replace(',','.');if(!s)return 0;var v=parseFloat(s);if(!isFinite(v)||v<0)return 0;return Math.round(v*100)*10}
function parseMoney(s){var d=String(s==null?'':s).replace(/\D/g,'');if(!d)return 0;var v=parseInt(d.slice(0,13),10);return isFinite(v)?v:0}
function parsePct(s){var v=parseFloat(String(s==null?'':s).replace(',','.'));if(!isFinite(v)||v<0)return 0;return Math.min(v,50)}
function fmtInt(n){n=Math.round(n);var neg=n<0;var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(neg?'-':'')+s}
function fmtKg(g){var neg=g<0;var v=Math.round(Math.abs(g)/10);var i=Math.floor(v/100),f=v%100;var s=fmtInt(i);if(f)s+=','+(f%10===0?String(f/10):(f<10?'0'+f:String(f)));return(neg?'-':'')+s}
function fmtD(n){return fmtInt(n)+'đ'}
function newTare(){return{mode:'none',perMa:0,nLong:0,kgLong:0,total:0}}
/* đổi dữ liệu bản cũ (bì ghi theo từng mã) sang bản mới (cách trừ bì chọn một chỗ) */
function migrate(st){
  st.groups.forEach(function(g){
    if(g.tare)return;
    var ts=st.entries.filter(function(e){return e.gid===g.id&&e.kind!=='b'}).map(function(e){return e.t||0});
    var sum=ts.reduce(function(a,b){return a+b},0),hasBi=st.entries.some(function(e){return e.gid===g.id&&e.kind==='b'});
    g.tare=newTare();
    if(hasBi&&sum>0){ /* bản cũ vừa cân bì rỗng vừa ghi bì từng mã: gộp thành tổng kg bì để kết quả giữ nguyên */
      var bi=0;st.entries.forEach(function(e){if(e.gid===g.id&&e.kind==='b')bi+=e.w});
      st.entries=st.entries.filter(function(e){return!(e.gid===g.id&&e.kind==='b')});g.tare.mode='tong';g.tare.total=sum+bi}
    else if(hasBi)g.tare.mode='can';
    else if(sum>0&&ts.every(function(t){return t===ts[0]})){g.tare.mode='ma';g.tare.perMa=ts[0]}
    else if(sum>0){g.tare.mode='tong';g.tare.total=sum}
  });
  st.entries.forEach(function(e){delete e.t});
  return st;
}
function tareInfo(g,nMa,biSum,nBi,gross){
  var t=g.tare||newTare(),kg=0,desc='';
  if(t.mode==='ma'){kg=(t.perMa||0)*nMa;desc=fmtKg(t.perMa||0)+' kg × '+nMa+' mã'}
  else if(t.mode==='long'){kg=(t.nLong||0)*(t.kgLong||0);desc=(t.nLong||0)+' lồng × '+fmtKg(t.kgLong||0)+' kg'}
  else if(t.mode==='can'){kg=biSum;desc='cân bì rỗng '+nBi+' lần'}
  else if(t.mode==='tong'){kg=t.total||0;desc='tổng bì'}
  return{kg:Math.min(kg,gross),desc:desc,mode:t.mode};
}
function compute(st,cfg){
  var rk=(cfg&&cfg.roundKg)||10,rm=(cfg&&cfg.roundMoney)||1;
  var gs=st.groups.map(function(g){
    var gross=0,biSum=0,con=0,nMa=0,nBi=0,grossCon=0,nNoCon=0;
    st.entries.forEach(function(e){if(e.gid!==g.id)return;
      if(e.kind==='b'){biSum+=e.w;nBi++}else{gross+=e.w;con+=(e.con||0);nMa++;if(e.con>0)grossCon+=e.w;else nNoCon++}});
    var ti=tareInfo(g,nMa,biSum,nBi,gross),tare=ti.kg;
    var net1=Math.max(0,gross-tare);
    var hao=R10(net1*(g.haoPct||0)/100);
    var truCon=Math.min(R10(con*(g.truCon||0)),Math.max(0,net1-hao));
    var truKg=Math.min(g.truKg||0,Math.max(0,net1-hao-truCon));
    var net=roundStep(Math.max(0,net1-hao-truCon-truKg),rk);
    var money=Math.round(net*(g.price||0)/1000);
    /* bình quân kg/con chỉ tính trên các mã CÓ nhập số con (bì chia theo tỉ lệ cân): mã quên nhập số con không làm sai bình quân.
       Mọi mã đều có số con thì netCon = net1, kết quả y như cũ. */
    var netCon=gross>0?Math.max(0,grossCon-tare*grossCon/gross):0;
    return{id:g.id,name:g.name,price:g.price||0,haoPct:g.haoPct||0,gross:gross,tare:tare,tareDesc:ti.desc,tareMode:ti.mode,biSum:biSum,net1:net1,hao:hao,truCon:truCon,truKg:truKg,net:net,con:con,nMa:nMa,nBi:nBi,money:money,netCon:netCon,nNoCon:con>0?nNoCon:0,avg:con>0?R10(netCon/con):0};
  });
  var t={groups:gs,gross:0,tare:0,net1:0,net:0,con:0,nMa:0,goods:0,netCon:0};
  gs.forEach(function(g){t.gross+=g.gross;t.tare+=g.tare;t.net1+=g.net1;t.net+=g.net;t.con+=g.con;t.nMa+=g.nMa;t.goods+=g.money;t.netCon+=g.netCon});
  t.avg=t.con>0?R10(t.netCon/t.con):0;
  t.goodsR=roundStep(t.goods,rm);
  t.fee=st.fee||0;t.oldDebt=st.oldDebt||0;t.deposit=st.deposit||0;t.paid=st.paid||0;
  t.due=t.goodsR+t.fee+t.oldDebt-t.deposit;
  t.remain=t.due-t.paid;
  t.cost=st.costPrice>0?Math.round(t.net*st.costPrice/1000):0;
  t.profit=st.costPrice>0?t.goodsR-t.cost:0;
  return t;
}
function outliers(st){
  var out={};
  st.groups.forEach(function(g){
    var es=st.entries.filter(function(e){return e.gid===g.id&&e.kind!=='b'});
    if(es.length<5)return;
    var allCon=es.every(function(e){return e.con>0});
    var val=function(e){return allCon?e.w/e.con:e.w};
    var v=es.map(val).sort(function(a,b){return a-b});var m=v[Math.floor(v.length/2)];
    es.forEach(function(e){var x=val(e);if(x<m*0.65||x>m*1.5)out[e.id]=1});
  });
  return out;
}
/* Số con có vẻ sai so với số cân của mã này? Trả về gam/con nếu đáng ngờ, 0 nếu ổn.
   Đã có các mã trước (cùng loại, có số con): lệch quá 2 lần so với mức giữa. Chưa có mã nào: ngoài khoảng 0,3–15 kg/con. */
function conOdd(st,gid,w,con){
  if(!(con>0)||!(w>0))return 0;
  var r=w/con,ref=[];
  st.entries.forEach(function(e){if(e.gid===gid&&e.kind!=='b'&&e.con>0)ref.push(e.w/e.con)});
  if(ref.length){ref.sort(function(a,b){return a-b});var m=ref[Math.floor(ref.length/2)];return(r<m*0.5||r>m*2)?r:0}
  return(r<300||r>15000)?r:0;
}
/* chia mã cân thành các cột, mỗi cột 5 mã */
function toCols(list){var c=[];for(var i=0;i<list.length;i+=5)c.push(list.slice(i,i+5));return c}
function docSo(n){
  n=Math.round(n);if(n===0)return'không';if(n<0)return'âm '+docSo(-n);
  var D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function tri(x,full){var tr=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10,s='';
    if(full||tr>0)s=D[tr]+' trăm';
    if(ch>1){s+=' '+D[ch]+' mươi';if(dv===1)s+=' mốt';else if(dv===5)s+=' lăm';else if(dv>0)s+=' '+D[dv]}
    else if(ch===1){s+=' mười';if(dv===5)s+=' lăm';else if(dv>0)s+=' '+D[dv]}
    else if(dv>0){if(full||tr>0)s+=' lẻ';s+=' '+D[dv]}
    return s.trim()}
  function below(x,full){var U=['',' nghìn',' triệu'],g=[x%1000,Math.floor(x/1000)%1000,Math.floor(x/1e6)],parts=[],first=!full;
    for(var i=2;i>=0;i--){if(g[i]===0)continue;parts.push(tri(g[i],!first)+U[i]);first=false}
    return parts.join(' ')}
  if(n>=1e9){var hi=Math.floor(n/1e9),lo=n%1e9;return docSo(hi)+' tỷ'+(lo?' '+below(lo,true):'')}
  return below(n,false);
}
function tienChu(n){var s=docSo(n);return s.charAt(0).toUpperCase()+s.slice(1)+' đồng'}
function fmtDate(ts){var d=new Date(ts),p=function(x){return x<10?'0'+x:''+x};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function flockAge(st){if(!st.flock||!st.flock.hatch)return NaN;var a=new Date(st.flock.hatch);a.setHours(0,0,0,0);var b=new Date(st.createdAt);b.setHours(0,0,0,0);return Math.floor((b-a)/864e5)}
function flockLine(st){if(!st.flock||!st.flock.name)return'';var a=flockAge(st);return st.flock.name+(isFinite(a)&&a>=0?' · '+a+' ngày tuổi':'')}
function billText(st,cfg,c){
  var L=[];
  L.push('PHIẾU CÂN GÀ'+(cfg.shop?' - '+cfg.shop:''));
  if(cfg.shopPhone)L.push('ĐT: '+cfg.shopPhone);
  L.push('Ngày: '+fmtDate(st.createdAt));
  if(st.customer.name)L.push('Khách: '+st.customer.name+(st.customer.phone?' - '+st.customer.phone:''));
  if(flockLine(st))L.push('Đàn: '+flockLine(st));
  c.groups.forEach(function(g){
    if(!g.nMa&&!g.nBi)return;
    L.push('');L.push('* '+g.name+' - '+fmtD(g.price)+'/kg');
    toCols(st.entries.filter(function(e){return e.gid===g.id&&e.kind!=='b'})).forEach(function(col,i){
      var s=0;col.forEach(function(e){s+=e.w});
      L.push('Cột '+(i+1)+': '+col.map(function(e){return fmtKg(e.w)}).join(' + ')+' = '+fmtKg(s))});
    if(g.tareMode==='can'&&g.nBi)L.push('Bì rỗng: '+st.entries.filter(function(e){return e.gid===g.id&&e.kind==='b'}).map(function(e){return fmtKg(e.w)}).join(' + ')+' = '+fmtKg(g.biSum));
    L.push('Số mã: '+g.nMa+(g.con?' | Số con: '+fmtInt(g.con)+(g.nNoCon?' ('+g.nNoCon+' mã chưa có số con)':''):''));
    L.push('Tổng cân: '+fmtKg(g.gross)+' kg');
    if(g.tare)L.push('Trừ bì ('+g.tareDesc+'): -'+fmtKg(g.tare)+' kg');
    if(g.hao)L.push('Trừ hao '+String(g.haoPct).replace('.',',')+'%: -'+fmtKg(g.hao)+' kg');
    if(g.truCon)L.push('Trừ theo con: -'+fmtKg(g.truCon)+' kg');
    if(g.truKg)L.push('Trừ thêm: -'+fmtKg(g.truKg)+' kg');
    L.push('Kg tính tiền: '+fmtKg(g.net)+' kg'+(g.avg?' (bình quân '+fmtKg(g.avg)+' kg/con'+(g.nNoCon?', tính trên '+(g.nMa-g.nNoCon)+'/'+g.nMa+' mã có số con':'')+')':''));
    L.push('Thành tiền: '+fmtD(g.money));
  });
  L.push('');
  L.push('TIỀN HÀNG: '+fmtD(c.goodsR));
  if(c.fee)L.push('Phí khác: +'+fmtD(c.fee));
  if(c.oldDebt)L.push('Nợ cũ: +'+fmtD(c.oldDebt));
  if(c.deposit)L.push('Đã cọc: -'+fmtD(c.deposit));
  L.push('PHẢI THU: '+fmtD(c.due));
  L.push('('+tienChu(c.due)+')');
  if(c.paid){L.push('Khách trả: '+fmtD(c.paid));L.push(c.remain>0?'CÒN NỢ: '+fmtD(c.remain):(c.remain<0?'Thối lại: '+fmtD(-c.remain):'Đã trả đủ'))}
  if(st.customer.note){L.push('');L.push('Ghi chú: '+st.customer.note)}
  var q=qrInfo(st,c,cfg),bl=bankLine(cfg);
  if(bl){L.push('');L.push('Chuyển khoản: '+bl);if(q){L.push('Số tiền chuyển: '+fmtD(q.amt)+(q.part?' (còn nợ)':''));L.push('Nội dung chuyển khoản: '+q.note)}}
  return L.join('\n');
}
/* ----- đọc số từ cân điện tử (Bluetooth / serial) ----- */
function parseScaleLine(s){
  if(!s)return null;
  s=String(s).replace(/[\x00-\x1f\x7f]/g,' ').trim();if(!s)return null;
  var up=s.toUpperCase(),stable=null;
  if(/(^|[^A-Z])ST([^A-Z]|$)/.test(up))stable=true;else if(/(^|[^A-Z])(US|UT)([^A-Z]|$)/.test(up))stable=false;
  if(/(^|[^A-Z])OL([^A-Z]|$)/.test(up))return null;
  var num,unit='kg';
  if(s.charAt(0)==='='){ /* kiểu đầu cân gửi số đảo ngược: =04.2500 nghĩa là 0052.40 */
    var body=s.slice(1).replace(/[^0-9.\-]/g,'');if(!/\d/.test(body))return null;
    num=parseFloat(body.split('').reverse().join(''));
  }else{
    var re=/([+-]?)\s*(\d+(?:[.,]\d+)?)\s*(kg|g|lb)?(?![a-z0-9])/ig,m,best=null;
    while((m=re.exec(s))){var c={num:parseFloat(m[2].replace(',','.'))*(m[1]==='-'?-1:1),unit:(m[3]||'').toLowerCase(),dec:/[.,]/.test(m[2])};
      if(!best||(c.unit&&!best.unit)||(!!c.unit===!!best.unit&&(c.dec||!best.dec)))best=c}
    if(!best)return null;num=best.num;if(best.unit)unit=best.unit;
  }
  if(!isFinite(num))return null;
  var g=unit==='g'?num:(unit==='lb'?num*453.59237:num*1000);
  return{g:R10(g),stable:stable};
}
function ScaleStream(){this.buf=''}
ScaleStream.prototype.feed=function(chunk){
  var parts=(this.buf+chunk).replace(/=/g,'\n=').split(/[\r\n\x02\x03]+/),out=[];
  this.buf=parts.pop();
  if(this.buf.length>80){parts.push(this.buf);this.buf=''}
  parts.forEach(function(p){var r=parseScaleLine(p);if(r)out.push(r)});
  return out;
};
ScaleStream.prototype.flush=function(){var r=parseScaleLine(this.buf);this.buf='';return r?[r]:[]};

   chỉ ngắt câu cũ khi nó còn đang đọc; theo dõi máy có đọc thật không — không đọc được thì kêu “bíp” thay và ghi rõ lý do ở thẻ Cài đặt. */
var IOS=false;try{IOS=/iP(hone|ad|od)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}catch(e){}

function ttsScan(){
  if(!TTS.has)return;
  try{var vs=speechSynthesis.getVoices()||[],best=null,bs=-1;
    for(var i=0;i<vs.length;i++){var v=vs[i],l=String(v.lang||'').toLowerCase().replace('_','-');
      if(l!=='vi'&&l.indexOf('vi-')!==0)continue;
      var sc=(v.localService?2:0)+(v.default?1:0)+(l==='vi-vn'?1:0);if(sc>bs){bs=sc;best=v}}
    TTS.n=vs.length;TTS.vi=best}catch(e){}
}
/* chắc chắn không đọc được: trình duyệt không có bộ đọc, hoặc máy có danh sách giọng mà không có giọng tiếng Việt nào */
function ttsDead(){return !TTS.has||(TTS.n>0&&!TTS.vi)}
function ttsRate(){var r=parseFloat(cfg.speakRate);return isFinite(r)&&r>=0.5&&r<=3?r:1.4}
function ttsSay(t,test){
  ttsScan();
  if(ttsDead()){TTS.state='novi';TTS.testing=0;ttsPaint();return}
  var ss=speechSynthesis,u=new SpeechSynthesisUtterance(t),id=++TTS.seq,t0=Date.now(),started=false,fin=false,wd=0;
  u.lang='vi-VN';if(TTS.vi){try{u.voice=TTS.vi}catch(e){}}
  u.rate=ttsRate();u.pitch=1;u.volume=1;
  function end(good,why){
    if(fin)return;fin=true;clearTimeout(wd);if(TTS.testing===id)TTS.testing=0;
    if(id!==TTS.seq&&!good)return;                     /* câu cũ bị câu mới ngắt ngang: không tính là lỗi */
    if(good){TTS.state='ok';TTS.err='';TTS.fail=0}else{TTS.state='bad';TTS.err=why||'';TTS.fail++}
    ttsPaint();
  }
  u.onstart=function(){started=true;end(true)};
  u.onend=function(){if(!started)end(Date.now()-t0>=300,'end')};
  u.onerror=function(e){var c=e&&e.error;if(c==='interrupted'||c==='canceled'){fin=true;clearTimeout(wd);if(TTS.testing===id)TTS.testing=0;return}end(false,c||'error')};
  TTS.keep=u;TTS.testing=test?id:0;
  function go(){
    if(id!==TTS.seq)return;
    try{if(ss.paused)ss.resume()}catch(e){}
    try{ss.speak(u)}catch(e){end(false,'throw');return}
    wd=setTimeout(function(){if(!started)end(false,'silent')},3500);
  }
  var busy=false;try{busy=!!(ss.speaking||ss.pending)}catch(e){}
  if(busy){try{ss.cancel()}catch(e){}setTimeout(go,80)}else go();
}
function speak(t,beeped){
  if(!cfg.speak)return;
  ttsScan();
  var dead=ttsDead();
  if((dead||TTS.fail>0)&&!beeped)beep();               /* máy không đọc được: kêu “bíp” thay cho đọc */
  if(dead){TTS.state='novi';return}
  var done=false,go=function(){if(done)return;done=true;try{ttsSay(t)}catch(e){TTS.state='bad';TTS.fail++}};
  try{requestAnimationFrame(function(){setTimeout(go,0)})}catch(e){}
  setTimeout(go,160);
}

function btOnChar(ev){var dv=ev.target.value;if(!dv)return;
  if(String(ev.target.uuid).indexOf('00002a9d')===0){btLog('[2A9D] '+dv.byteLength+' byte');btReading(parseWeightChar(dv));return}
  btBytes(new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength))}
function btGatt(dev){
  return dev.gatt.connect().then(function(s){return s.getPrimaryServices()}).then(function(svcs){
    return Promise.all(svcs.map(function(s){return s.getCharacteristics().catch(function(){return[]})}))}).then(function(lists){
    var chs=[];lists.forEach(function(l){l.forEach(function(c){if(c.properties.notify||c.properties.indicate)chs.push(c)})});
    if(!chs.length)throw new Error('NOCHAR');
    return Promise.all(chs.map(function(c){return c.startNotifications().then(function(){c.addEventListener('characteristicvaluechanged',btOnChar);return 1}).catch(function(){return 0})}))
  }).then(function(r){if(!r.some(Boolean))throw new Error('NOCHAR');btUp('ble',dev.name||'cân Bluetooth')});
}
function btConnectBLE(){
  if(!NAV.bluetooth){BT.msg='Trình duyệt này không hỗ trợ Bluetooth. Dùng Chrome trên điện thoại Android hoặc máy tính (iPhone không hỗ trợ).';btPaint();return}
  btOff(true);BT.msg='Đang tìm cân… chọn tên cân trong danh sách hiện ra.';btPaint();
  try{NAV.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SVCS}).then(function(dev){
    BT.dev=dev;dev.addEventListener('gattserverdisconnected',btLost);BT.msg='Đang kết nối '+(dev.name||'cân')+'…';btPaint();return btGatt(dev)}).catch(btFail)}catch(e){btFail(e)}
}
function btConnectSerial(){
  if(!NAV.serial){BT.msg='Trình duyệt này chưa hỗ trợ kết nối Serial. Cập nhật Chrome bản mới nhất rồi thử lại.';btPaint();return}
  btOff(true);BT.msg='Chọn cổng của cân trong danh sách hiện ra (cân Bluetooth phải ghép đôi trong Cài đặt điện thoại trước).';btPaint();
  try{NAV.serial.requestPort().then(function(port){BT.port=port;return port.open({baudRate:cfg.btBaud||9600})}).then(function(){btUp('serial','cân qua cổng Serial');btPump()}).catch(btFail)}catch(e){btFail(e)}
}
function btPump(){var port=BT.port;if(!port||!port.readable)return;var rd;try{rd=port.readable.getReader()}catch(e){return}BT.reader=rd;
  (function pump(){rd.read().then(function(r){if(r.done){try{rd.releaseLock()}catch(e){}return}if(r.value)btBytes(r.value);pump()}).catch(function(){try{rd.releaseLock()}catch(e){}btLost()})})()}
function btLost(){
  if(!BT.on)return;BT.on=false;BT.live=null;BT.stable=false;
  if(BT.want&&BT.kind==='ble'&&BT.dev&&BT.retry<3){BT.retry++;BT.msg='Mất kết nối, đang nối lại lần '+BT.retry+'…';btPaint();
    setTimeout(function(){if(!BT.want||BT.on)return;btGatt(BT.dev).catch(function(){BT.msg='Mất kết nối với cân. Bấm kết nối lại.';btPaint()})},2000)}
  else{BT.msg='Mất kết nối với cân. Bấm kết nối lại.';toast('Mất kết nối với cân')}
  btPaint();
}

  try{if(BT.dev&&BT.dev.gatt&&BT.dev.gatt.connected)BT.dev.gatt.disconnect()}catch(e){}
  BT.on=false;BT.live=null;BT.stable=false;BT.reader=null;BT.port=null;BT.dev=null;if(!quiet){BT.msg='Đã ngắt kết nối cân.'}btPaint();

function btSim(){

    for(var j=0;j<4;j++)seq.push('ST,GS,+   0.00kg\r\n')});

  BT.simT=setInterval(function(){if(i>=seq.length){clearInterval(BT.simT);BT.simT=0;BT.on=false;BT.want=false;BT.live=null;BT.msg='Chạy thử xong: cân giả lập đã tự chốt 3 mã.';toast('Chạy thử xong');btPaint();return}btText(seq[i++])},200);
}

/* ---------- thẻ CÂN ---------- */
/* số con mỗi mã: giữ theo mã cân gần nhất của phiếu đang cân (tải lại trang / mở lại app vẫn còn), chưa có thì lấy số mặc định */
function lastCon(){if(!state.sample)for(var i=state.entries.length-1;i>=0;i--){var e=state.entries[i];if(e.kind!=='b'){if(e.con>0)return String(e.con);break}}return cfg.defCon?String(cfg.defCon):''}
var K={field:'w',w:'',c:lastCon(),kind:'h',gid:state.groups[0].id,hidePad:false,lastId:''};
function wGrams(){if(cfg.autoDec){var n=parseInt(K.w||'0',10)||0;return cfg.autoDec===1?n*100:n*10}return parseKg(K.w)}
function dispW(){if(cfg.autoDec){var n=parseInt(K.w||'0',10)||0;return(n/Math.pow(10,cfg.autoDec)).toFixed(cfg.autoDec).replace('.',',')}return K.w||'0'}
function renderScale(){
  var liveMode=BT.on&&!K.w,lv=btLive(),sc=$('#scale');
  $('#dispW').textContent=liveMode?(lv===null?'—':fmtKg(lv)):dispW();
  $('#dispC').textContent=K.kind==='b'?'—':(K.c||'0');
  var n=state.sample?1:state.entries.filter(function(e){return e.kind!=='b'&&e.gid===K.gid}).length+1;
  var base=K.kind==='b'?'Cân bì rỗng':'Mã cân thứ '+n;
  $('#lblW').textContent=liveMode?base+' · '+(lv===null?'chờ cân gửi số…':(BT.stable?'ĐỨNG SỐ':'đang dao động')):base;
  sc.className='scale'+(liveMode&&lv!==null&&BT.stable?' steady':'');
  var conMode=K.field==='c'&&K.kind!=='b';
  $('#addIco').textContent=conMode?'✓':'+';
  $('#addLbl').textContent=conMode?'XONG SỐ CON':(liveMode?'CHỐT MÃ':'CỘNG MÃ');
  $('#fW').setAttribute('aria-pressed',K.field==='w'?'true':'false');$('#fC').setAttribute('aria-pressed',K.field==='c'?'true':'false');
}
function press(k){
  wake();
  /* đang sửa ô Số con: nút đỏ là "XONG SỐ CON" — quay về ô số cân, chưa cộng mã */
  if(k==='add'){if(K.field==='c'&&K.kind!=='b'){K.field='w';K.fresh=false;renderScale();return}return addEntry()}
  if(k==='undo')return undoLast();
  var f=K.field,b=K[f];
  /* ô Số con đang giữ số của các mã trước: vừa chạm vào ô rồi bấm chữ số thì THAY số cũ (không nối thêm thành 2018) */
  var fresh=f==='c'&&K.fresh;if(k!==',')K.fresh=false;
  if(k==='bs')b=b.slice(0,-1);
  else if(k===','){if(f==='c'||(f==='w'&&cfg.autoDec))return;if(b.indexOf(',')>=0)return;b=(b||'0')+','}
  else{
    if(f==='c'){if(fresh)b='';if(b.length>=4)return;b=(b==='0'?'':b)+k}
    else if(f==='w'&&cfg.autoDec){b=b.replace(/^0+/,'');if(b.length>=6)return;b=b+k}
    else{var p=b.split(',');if(p.length>1){if(p[1].length>=2)return}else if(p[0].length>=4&&b!=='0')return;b=(b==='0'?'':b)+k}
  }
  K[f]=b;renderScale();
}
function addEntry(wAuto,auto,force){
  var w,fromLive=false;
  if(auto)w=wAuto;
  else if(force==='live'){w=wAuto;fromLive=true}   /* số trên cân đã được người dùng xác nhận ở hộp hỏi lại */
  else if(K.w)w=wGrams();
  else if(BT.on){w=btLive();fromLive=true;if(w===null){toast('Cân chưa gửi số về');return}}
  else w=0;
  if(!(w>0)){toast(fromLive?'Trên cân chưa có hàng':'Bấm số kg trước rồi mới cộng');return}
  var con=K.kind==='b'?0:(parseInt(K.c||'0',10)||0);
  /* số con trông sai so với số cân (bấm nhầm 2018 con, quên đổi số con cho lồng lẻ…): hỏi lại trước khi cộng */
  if(!force&&K.kind!=='b'){
    var odd=conOdd(state.sample?{entries:[]}:state,K.gid,w,con);
    if(odd){
      if(auto){BT.oddW=w;BT.oddCon=con;if(BT.cap)BT.cap.armed=true}
      confirmBox('Mã này '+fmtKg(w)+' kg mà ghi '+con+' con, tức '+fmtKg(R10(odd))+' kg mỗi con. Số con có đúng không?','Đúng, vẫn cộng',function(){addEntry(w,auto,fromLive?'live':true)});
      return;
    }
  }
  if(state.sample){state=newState();K.gid=state.groups[0].id}
  if(!grp(K.gid))K.gid=state.groups[0].id;
  var g=grp(K.gid);
  if(K.kind==='b'&&g.tare.mode!=='can')g.tare.mode='can';
  var e={id:uid(),gid:K.gid,kind:K.kind,w:w,con:con,at:Date.now()};
  state.entries.push(e);K.lastId=e.id;
  if(!auto){K.w='';K.field='w'}
  if((auto||fromLive)&&BT.cap)BT.cap.armed=false;
  BT.oddW=null;
  touch();renderCan();
  var ls=$('#list');ls.scrollTop=ls.scrollHeight;
  try{if(navigator.vibrate)navigator.vibrate(25)}catch(er){}
  if(auto||fromLive)beep();
  speak(kgSay(w),auto||fromLive);
}

function dedInput(t){
  var g=grp($('#d-gid').value);if(!g)return;var id=t.id,tr=g.tare;
  if(t.name==='dmode')tr.mode=t.value;
  else if(id==='d-perMa'){tr.perMa=parseKg(t.value);tr.mode='ma'}
  else if(id==='d-nLong'){tr.nLong=Math.min(parseMoney(t.value),9999);tr.mode='long'}
  else if(id==='d-kgLong'){tr.kgLong=parseKg(t.value);tr.mode='long'}
  else if(id==='d-total'){tr.total=parseKg(t.value);tr.mode='tong'}
  else if(id==='d-hao')g.haoPct=parsePct(t.value);
  else if(id==='d-truCon')g.truCon=Math.min(parseMoney(t.value),5000);
  else if(id==='d-truKg')g.truKg=parseKg(t.value);

function ln(a,b,cls){return'<div class="ln'+(cls?' '+cls:'')+'"><span>'+a+'</span><span>'+b+'</span></div>'}
function groupLines(g,noMoney){
  var h=ln('Tổng cân ('+g.nMa+' mã'+(g.con?', '+fmtInt(g.con)+' con':'')+')',fmtKg(g.gross)+' kg');
  if(g.tare)h+=ln('Trừ bì ('+esc(g.tareDesc)+')','−'+fmtKg(g.tare)+' kg');
  if(g.hao)h+=ln('Trừ hao '+String(g.haoPct).replace('.',',')+'%','−'+fmtKg(g.hao)+' kg');
  if(g.truCon)h+=ln('Trừ theo con','−'+fmtKg(g.truCon)+' kg');
  if(g.truKg)h+=ln('Trừ thêm','−'+fmtKg(g.truKg)+' kg');
  h+=ln('Kg tính tiền'+(g.avg?' · '+fmtKg(g.avg)+' kg/con'+(g.nNoCon?' (tính trên '+(g.nMa-g.nNoCon)+'/'+g.nMa+' mã có số con)':''):''),fmtKg(g.net)+' kg',noMoney?'tot':'');
  if(!noMoney)h+=ln('Thành tiền ('+fmtKg(g.net)+' × '+fmtInt(g.price)+')',fmtD(g.money),'tot');
  return h;
}
function payLines(c){
  var h=ln('Tiền hàng',fmtD(c.goodsR));
  if(c.goodsR!==c.goods)h+='<div class="hint">Đã làm tròn từ '+fmtD(c.goods)+'</div>';
  if(c.fee)h+=ln('Phí khác','+'+fmtD(c.fee));
  if(c.oldDebt)h+=ln('Nợ cũ','+'+fmtD(c.oldDebt));
  if(c.deposit)h+=ln('Đã cọc','−'+fmtD(c.deposit));
  h+=ln(c.due<0?'PHẢI TRẢ LẠI KHÁCH':'PHẢI THU',fmtD(Math.abs(c.due)),'tot big');
  h+='<div class="chu">'+esc(tienChu(Math.abs(c.due)))+'</div>';
  if(c.paid){h+=ln('Khách trả',fmtD(c.paid));
    h+=c.remain>0?ln('CÒN NỢ',fmtD(c.remain),'tot due'):(c.remain<0?ln('Thối lại khách',fmtD(-c.remain),'tot ok'):ln('Đã trả đủ','0đ','tot ok'))}
  return h;
}
function updateTien(){
  var c=compute(state,cfg);
  c.groups.forEach(function(g){var el=document.getElementById('gres-'+g.id);if(el)el.innerHTML=groupLines(g)});
  var p=$('#payres');if(p)p.innerHTML=payLines(c);
  var pr=$('#profres');if(pr)pr.innerHTML=state.costPrice>0?ln('Tiền vốn',fmtD(c.cost))+ln(c.profit>=0?'Lãi ước tính':'Lỗ ước tính',fmtD(Math.abs(c.profit)),c.profit>=0?'tot ok':'tot due'):'';
  $('#who').textContent=(state.customer.name?state.customer.name+' · ':'')+fmtD(c.goodsR);
}
function lastDebt(){
  var n=(state.customer.name||'').trim().toLowerCase();if(!n)return 0;
  for(var i=hist.length-1;i>=0;i--){var h=hist[i];if(h.id!==state.id&&(h.state.customer.name||'').trim().toLowerCase()===n)return h.sum.remain>0?h.sum.remain:0}
  return 0;
}

function saveBill(){
  if(state.sample){toast('Đây là phiếu mẫu, không lưu');return false}
  if(!state.entries.length){toast('Chưa có mã cân nào để lưu');return false}
  var c=compute(state,cfg);state.dirty=false;
  var rec={id:state.id,savedAt:Date.now(),state:JSON.parse(JSON.stringify(state)),sum:{kg:c.net,con:c.con,goods:c.goodsR,due:c.due,paid:c.paid,remain:c.remain}};
  syncHist();
  var i=-1;hist.forEach(function(h,j){if(h.id===state.id)i=j});
  if(i>=0)hist[i]=rec;else hist.push(rec);
  var g=state.groups[0];if(g.price)cfg.lastPrice=g.price;
  cfg.lastDed={tare:{mode:g.tare.mode,perMa:g.tare.perMa,kgLong:g.tare.kgLong},haoPct:g.haoPct,truCon:g.truCon};saveCfg();
  saveHist();saveState();
  if(FAIL[KH]){toast('⚠ KHÔNG lưu được phiếu vào máy. Hãy sao lưu ngay.');return false}
  toast('Đã lưu phiếu vào sổ');return true;
}

}

/* ---------- XOÁ HẾT để cân đợt mới ----------
   Xoá phiếu ĐANG CÂN: mọi mã cân, bì đã cân, tên khách, tiền cọc / tiền trả / nợ cũ. Giữ lại giá bán, cách trừ bì và mọi phiếu đã lưu trong Sổ.
   Phiếu chưa lưu mà bị xoá thì còn giữ tạm 24 giờ để bấm “Lấy lại phiếu vừa xoá” nếu lỡ tay. */
function inSo(id){return hist.some(function(h){return h.id===id})}
function billBlank(){var s=state,cu=s.customer;return !s.entries.length&&!cu.name&&!cu.phone&&!cu.note&&!s.fee&&!s.deposit&&!s.oldDebt&&!s.paid&&!s.costPrice&&!s.flock}
function trashGet(){
  var t=FAIL[KT]?mem[KT]:lsGet(KT);
  if(!t||!validState(t.state)||!t.state.entries.length||!(Date.now()-(t.at||0)<864e5))return null;
  return t;
}
function askClearAll(){
  if(state.sample){doClearAll(false);return}
  if(billBlank()){K.w='';K.kind='h';K.field='w';renderCan();toast('Phiếu đang trống — sẵn sàng cân đợt mới');return}
  syncHist();
  var c=compute(state,cfg),nB=state.entries.filter(function(e){return e.kind==='b'}).length,what=[];
  if(c.nMa)what.push('<b>'+c.nMa+' mã cân</b> ('+fmtKg(c.gross)+' kg)');
  if(nB)what.push(nB+' lần cân bì');
  if(state.customer.name)what.push('khách <b>'+esc(state.customer.name)+'</b>');
  what.push('tiền cọc, tiền trả, nợ cũ của phiếu này');
  var has=state.entries.length>0,unsaved=has&&(state.dirty||!inSo(state.id));
  openModal('<h3>Xoá hết để cân đợt mới?</h3>'+
    '<div class="lines"><div>Sẽ xoá: '+what.join(', ')+'.</div><div>Giữ lại: giá bán, cách trừ bì và các phiếu đã lưu trong Sổ.</div>'+
    (unsaved?'<div style="color:var(--warn);font-weight:700">Phiếu này CHƯA lưu vào Sổ.</div>':(has?'<div style="color:var(--ok);font-weight:600">Phiếu này đã lưu trong Sổ.</div>':''))+'</div>'+
    '<div class="btns"><button class="btn" data-m="close">Không xoá</button>'+
    (unsaved?'<button class="btn pri" data-m="clrsave">Lưu vào Sổ rồi xoá</button><button class="btn danger" data-m="clrgo">Xoá, không lưu</button>':'<button class="btn pri" data-m="clrgo">Xoá hết</button>')+'</div>','clear');
}
function doClearAll(saveFirst){
  var was=state,keep=false,sample=!!was.sample;
  if(saveFirst){if(!saveBill())return}                          /* lưu không được thì KHÔNG xoá */
  else if(!sample&&was.entries.length&&(was.dirty||!inSo(was.id)))keep=true;
  if(!sample){
    var g=was.groups[0];if(g.price)cfg.lastPrice=g.price;
    cfg.lastDed={tare:{mode:g.tare.mode,perMa:g.tare.perMa,kgLong:g.tare.kgLong},haoPct:g.haoPct,truCon:g.truCon};saveCfg();
    if(was.entries.length)lsSet(KT,keep?{at:Date.now(),state:JSON.parse(JSON.stringify(was))}:null);   /* phiếu vừa xoá không có mã nào thì không đụng tới phiếu đang giữ tạm trước đó */
  }
  state=newState();resetK();BT.oddW=null;saveState();
  closeModal();showTab('can');
  toast(sample?'Đã xoá phiếu mẫu. Sẵn sàng cân.':(saveFirst?'Đã lưu vào Sổ và xoá hết. Sẵn sàng cân đợt mới.':'Đã xoá hết. Sẵn sàng cân đợt mới.'));
}
function trashRestore(){
  var t=trashGet();if(!t)return;
  if(state.entries.length&&!state.sample){toast('Phiếu đang cân đã có mã — xoá các mã đó trước rồi mới lấy lại được');return}
  state=migrate(JSON.parse(JSON.stringify(t.state)));state.sample=false;state.dirty=true;
  lsSet(KT,null);resetK();saveState();showTab('can');toast('Đã lấy lại phiếu vừa xoá');
}

/* ---------- ẢNH PHIẾU ----------
   Vẽ lại ĐÚNG phiếu đang xem lên một tấm ảnh: lấy chính khung phiếu (billHTML) rồi vẽ từng phần theo thứ tự,
   nên ảnh luôn có đủ và đúng mọi dòng như phiếu trên màn hình. Dùng cho “Chia sẻ ảnh phiếu” và in máy in nhiệt Bluetooth.
   (Web không được tự chụp màn hình; cách “chụp qua SVG” thì hỏng trên iPhone — nên phải tự vẽ.) */
var FB='"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',FNUM='"Chakra Petch",'+FB;
function fontsThen(cb){
  var fin=false,t=setTimeout(done,1500);function done(){if(fin)return;fin=true;clearTimeout(t);cb()}
  try{var fs=document.fonts;if(!fs||!fs.load){done();return}

function topWin(){if(EMBED){try{var p=window.parent;if(p&&p.document&&p.document.body)return p}catch(e){}}return window}
function printClean(W){try{var D=W.document;['cgPrintHost','cgPrintCss'].forEach(function(id){var el=D.getElementById(id);if(el&&el.parentNode)el.parentNode.removeChild(el)});D.documentElement.classList.remove('cg-pr')}catch(e){}}
/* mode: 'A4' | 'A5' (máy tính) · '58' | '80' (in nhiệt qua trình duyệt) */
function printDoc(st,mode){
  if(Date.now()-PR.dlg<1500)return;PR.dlg=Date.now();               /* lỡ bấm In hai lần liền thì chỉ mở 1 hộp in */
  var W=topWin(),D=W.document,th=mode==='58'||mode==='80',tok=++PR.tok;
  printClean(W);
  try{
    var css=D.createElement('style');css.id='cgPrintCss';
    css.textContent='@media screen{#cgPrintHost{display:none!important}}'+
      '@media print{@page{'+(th?'margin:0':'size:'+(mode==='A5'?'portrait':'A4')+';margin:'+(mode==='A5'?'8mm':'12mm'))+'}'+
      'html.cg-pr,html.cg-pr body{display:block!important;visibility:visible!important;position:static!important;float:none!important;width:auto!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;margin:0!important;padding:0!important;border:0!important;transform:none!important;background:#fff!important;color-scheme:light!important}'+
      'html.cg-pr body>*:not(#cgPrintHost){display:none!important}'+
      'html.cg-pr body>#cgPrintHost{display:block!important;visibility:visible!important;position:static!important;float:none!important;width:auto!important;height:auto!important;max-height:none!important;overflow:visible!important;margin:0!important;padding:0!important;border:0!important;opacity:1!important;transform:none!important;background:#fff!important;color:#000!important}}';
    var host=D.createElement('div');host.id='cgPrintHost';
    var inner='<style>'+PRINT_CSS+'</style><div class="pg '+(th?'th p'+mode:(mode==='A5'?'a5':'a4'))+'">'+billHTML(st,compute(st,cfg)).replace(' id="bill"','')+'</div>';
    var root=null;try{if(host.attachShadow)root=host.attachShadow({mode:'open'})}catch(e){root=null}
    (root||host).innerHTML=inner;
    D.head.appendChild(css);D.body.appendChild(host);D.documentElement.classList.add('cg-pr');
  }catch(e){printClean(W);toast('Máy này không in được. Hãy dùng “Chia sẻ ảnh phiếu”.');return}
  /* Gỡ tờ phiếu in ra khỏi trang KHI HỘP THOẠI IN ĐÃ ĐÓNG — không gỡ sớm, vì có máy vẽ lại bản in mỗi lần người dùng đổi khổ giấy trong hộp in.
     · Trình duyệt giữ trang đứng yên trong lúc hộp in mở (Chrome): lệnh in trả về là hộp in đã đóng -> gỡ ngay.
     · Trình duyệt không giữ trang: chờ tới khi người dùng chạm lại vào app (lúc đó hộp in chắc chắn đã đóng) mới gỡ.
     Trong lúc chờ, màn hình không khác gì: tờ phiếu chỉ hiện trên bản in. */
  var done=false,t1=0,evs=['pointerdown','touchstart','mousedown','keydown'];
  function off(){evs.forEach(function(ev){try{document.removeEventListener(ev,onUser,true)}catch(e){}try{D.removeEventListener(ev,onUser,true)}catch(e){}})}
  function clean(){if(done)return;done=true;off();if(PR.clean===clean)PR.clean=null;if(tok===PR.tok)printClean(W)}
  function onUser(){if(t1&&Date.now()-t1>1000)clean()}
  PR.clean=clean;
  setTimeout(function(){
    if(done)return;
    try{W.focus()}catch(e){}
    var t0=Date.now();
    try{W.print()}catch(e){clean();toast('Trình duyệt này không mở được hộp thoại in. Hãy mở app bằng Chrome hoặc Safari.');return}
    if(Date.now()-t0>700){clean();return}
    t1=Date.now();evs.forEach(function(ev){try{document.addEventListener(ev,onUser,true);if(D!==document)D.addEventListener(ev,onUser,true)}catch(e){}});
  },60);
}
function prConnect(){
  if(!prBtOK()){toast('Máy này không in Bluetooth được (cần Chrome trên Android hoặc máy tính).');return Promise.resolve(false)}
  var rq,picked=false;try{rq=NAV.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:PR_SVCS})}catch(e){rq=Promise.reject(e)}
  return rq.then(function(dev){
    picked=true;
    if(BT.on&&BT.dev&&(BT.dev===dev||(dev.id&&BT.dev.id===dev.id))){toast('Thiết bị vừa chọn là CÂN đang nối, không phải máy in.');return false}
    try{if(PR.dev&&PR.dev!==dev&&PR.dev.gatt&&PR.dev.gatt.connected)PR.dev.gatt.disconnect()}catch(e){}
    PR.ch=null;PR.dev=dev;PR.name=dev.name||'Máy in';prSay('Đang kết nối '+PR.name+'…');
    if(!dev._cgPr){dev._cgPr=1;dev.addEventListener('gattserverdisconnected',function(){if(PR.dev===dev){PR.ch=null;prConnPaint()}})}
    return prFind(dev).then(function(wc){
      if(!wc){PR.dev=null;try{dev.gatt.disconnect()}catch(e){}toast('Máy in này không cho ghi qua web (có thể là Bluetooth cổ điển SPP — web không dùng được).');return false}
      PR.ch=wc;cfg.prName=PR.name;saveCfg();toast('Đã kết nối: '+PR.name);return true;
    });
  }).catch(function(e){
    PR.ch=null;PR.dev=null;
    toast(!picked&&e&&e.name==='NotFoundError'?'Chưa chọn máy in nào.':'Không kết nối được máy in Bluetooth.');
    return false;
  });
}
/* nối tới máy in rồi lấy cổng ghi đầu tiên tìm thấy, theo đúng thứ tự như app Sổ Nợ */
function prFind(dev){
  return dev.gatt.connect().then(function(srv){return srv.getPrimaryServices()}).then(function(svcs){
    var i=0;function next(){if(i>=svcs.length)return null;
      return svcs[i++].getCharacteristics().then(function(cs){for(var j=0;j<cs.length;j++){var pp=cs[j].properties;if(pp&&(pp.write||pp.writeWithoutResponse))return cs[j]}return next()},function(){return next()})}
    return next();
  });
}
/* máy in đã chọn trong lần mở app này mà tự ngắt (máy in ngủ, đi xa): nối lại thẳng, không bắt chọn lại từ đầu. Quá 8 giây không nối được thì thôi. */
function prReconnect(){
  var dev=PR.dev;if(!dev||!dev.gatt)return Promise.resolve(false);
  prSay('⏳ Đang nối lại '+(PR.name||'máy in')+'…');
  return new Promise(function(res){
    var fin=false,t=setTimeout(function(){if(fin)return;fin=true;try{dev.gatt.disconnect()}catch(e){}res(false)},8000);
    prFind(dev).then(function(wc){if(fin)return;fin=true;clearTimeout(t);if(wc&&PR.dev===dev){PR.ch=wc;res(true)}else res(false)},function(){if(fin)return;fin=true;clearTimeout(t);res(false)});
  });
}
/* gửi từng gói 128 byte, nghỉ 20 ms giữa các gói (như app Sổ Nợ) để máy in kịp nhận */
function prWrite(bytes,onP){
  var ch=PR.ch,i=0,n=bytes.length;
  return new Promise(function(res,rej){
    if(!ch){rej(new Error('no printer'));return}
    (function step(){
      if(i>=n){res();return}
      var part=bytes.slice(i,i+128),w;i+=128;
      try{w=ch.writeValueWithoutResponse(part)}catch(e){w=Promise.reject(e)}
      w.catch(function(){return ch.writeValue(part)}).then(function(){if(onP)onP(Math.min(100,Math.round(i*100/n)));setTimeout(step,20)},rej);
    })();
  });
}
function prBluetooth(st,force){
  if(PR.busy){toast('⏳ Đang in — chờ in xong');return}
  if(!prBtOK()){toast('Máy này không in Bluetooth được (cần Chrome trên Android hoặc máy tính). Hãy dùng 2 cách in ở trên.');return}
  PR.busy=true;
  /* chưa chọn máy in lần nào: hỏi chọn ngay trong cú bấm (trình duyệt chỉ cho chọn khi có thao tác của người dùng). Đã chọn rồi mà bị ngắt: nối lại thẳng. */
  var p=PR.ch?Promise.resolve(true):(PR.dev?prReconnect().then(function(ok){if(!ok)toast('Không nối lại được '+(PR.name||'máy in')+'. Bật máy in rồi bấm in lại, hoặc bấm “Kết nối / đổi máy in Bluetooth”.');return ok}):prConnect());
  p.then(function(ok){
    if(!ok)return'no';
    prSay('⏳ Đang chuẩn bị bản in…');
    return new Promise(function(res){fontsThen(res)}).then(function(){
      var cv=thermalCanvas(st,compute(st,cfg),prPaper()),cm=Math.round(cv.height/80);
      if(cv.height>30000)return'long';
      if(cm>150&&!force)return'ask'+cm;
      var mo=monoOf(cv),cmd=rasterCmd(mo.mono,mo.w,mo.h);
      toast('Đang in…');prSay('⏳ Đang gửi bản in tới máy in… 0%');
      return prWrite(cmd,function(pc){prSay('⏳ Đang gửi bản in tới máy in… '+pc+'%')}).then(function(){return'ok'});
    });
  }).then(function(r){
    PR.busy=false;
    if(r==='ok'){prSay('✓ Đã gửi lệnh in.');toast('Đã gửi lệnh in ✓')}
    else if(r==='long'){prSay(prNote());toast('Phiếu quá dài để in nhiệt. Hãy in A4/A5.')}
    else if(typeof r==='string'&&r.indexOf('ask')===0){prSay(prNote());confirmBox('Phiếu này in ra khoảng '+r.slice(3)+' cm giấy. Vẫn in?','Vẫn in',function(){prBluetooth(st,true)})}
    else prSay(prNote());
    prConnPaint();
  },function(){
    PR.busy=false;PR.ch=null;try{if(PR.dev&&PR.dev.gatt&&PR.dev.gatt.connected)PR.dev.gatt.disconnect()}catch(x){}
    prSay('In lỗi — thử kết nối lại máy in.');toast('In lỗi — thử kết nối lại máy in.');prConnPaint();
  });
}

function pickContact(cb){
  CT.cb=cb;

  CTV.hid=ctHid();CTV.got='';CTV.ms=0;
  /* rỗng / bị huỷ: nếu trang đã bị che lúc đang chọn thì là Chrome tự đóng (đợi một chút cho tin “trang bị che” kịp tới), không phải người dùng bấm huỷ */
  function empty(why,quick){CTV.ms=Date.now()-t0;CTV.got=why;
    setTimeout(function(){openModal(ctHelp(CTV.hid||ctHid()?'hidden':(quick&&CTV.ms<1500?'empty':'cancel')),'ct')},350)}
  function got(a){try{
    if(!a||!a.length){empty('rỗng (chưa chọn ai)',true);return}   /* mở rồi đóng ngay = máy chưa cho đọc danh bạ / Chrome tự đóng; để một lúc rồi đóng = bấm quay lại / huỷ */
    CTV.ms=Date.now()-t0;CTV.got='có người được chọn';
    var c=a[0]||{},name=c.name&&c.name.length?String(c.name[0]).trim():'',tels=[];
    (c.tel||[]).forEach(function(x){x=cleanTel(x);if(x&&tels.indexOf(x)<0)tels.push(x)});
    if(!name&&!tels.length){openModal(ctHelp('noprops'),'ct');return}
    if(tels.length>1){ctMulti(cb,name,tels);return}
    cb(name,tels[0]||'');
  }catch(ex){openModal(ctHelp('err',ex),'ct')}}
  (function go(i){
    var p;try{p=L[i](['name','tel'],{multiple:false})}catch(e){p=Promise.reject(e)}
    Promise.resolve(p).then(got,function(e){
      if(e&&e.name==='AbortError'){empty('huỷ (AbortError)',false);return}
      if(!e0)e0=e;
      if(i+1<L.length&&e&&/^(InvalidStateError|SecurityError|TypeError|NotAllowedError)$/.test(e.name))return go(i+1);   /* cách này bị chặn: thử cách kế */
      CTV.ms=Date.now()-t0;CTV.got='lỗi';
      openModal(ctHelp('err',e0),'ct')});
  })(0);
}

/* ---------- DÁN: sao chép số trong app Danh bạ của máy rồi dán vào đây (không phụ thuộc việc Chrome mở danh bạ) ---------- */
var CTLB='Điện thoại di động|Số điện thoại|Điện thoại|Di động|Mobile|Phone|Tel|SĐT|SDT|ĐT|Zalo|Liên hệ|LH';   /* chữ đứng sát trước số, bỏ khỏi tên */
function ctRe(s){return s.replace(/[.*+?^${}()|[\]\\\/-]/g,'\\$&')}
function ctQP(s){try{return decodeURIComponent(s.replace(/=([0-9A-Fa-f]{2})/g,'%$1'))}catch(e){return s}}
/* tách tên + số từ nội dung dán: chỉ có số, “tên + số”, hoặc thẻ liên hệ vCard (.vcf) */
function ctParse(txt){
  var s=String(txt==null?'':txt),name='',tels=[],hit=[],m,rest;
  try{s=s.normalize('NFC')}catch(e){}
  s=s.replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'').replace(/\r\n?/g,'\n').trim();
  function add(t){t=cleanTel(t);if(!/^(0\d{8,10}|\+\d{8,14})$/.test(t))return false;if(tels.indexOf(t)<0)tels.push(t);return true}
  function tidy(x){x=x.replace(/\s+/g,' ').replace(/^[\s,;:|·\-–—()\[\]"'“”]+|[\s,;:|·\-–—()\[\]"'“”]+$/g,'').trim();return new RegExp('^(?:'+CTLB+'|Mobile|Home|Work|Cell|Main)$','i').test(x)?'':x}
  if(!s)return{name:'',tels:[]};
  if(/BEGIN:VCARD/i.test(s)){
    var phys=s.split('\n'),raw=[],fn='',nn='',i,j,l,v,k;
    for(i=0;i<phys.length;i++){l=phys[i];                                   /* ghép dòng bị ngắt: dòng QP kết thúc bằng "=" nối thẳng dòng sau; dòng sau bắt đầu bằng khoảng trắng là phần nối tiếp */
      if(/QUOTED-PRINTABLE/i.test(l))while(/=\s*$/.test(l)&&i+1<phys.length)l=l.replace(/=\s*$/,'')+phys[++i];
      while(i+1<phys.length&&/^[ \t]/.test(phys[i+1]))l+=phys[++i].slice(1);
      raw.push(l)}
    for(j=0;j<raw.length;j++){l=raw[j];
      m=/^(?:[\w\-]+\.)?(FN|N|TEL)((?:;[^:]*)?):(.*)$/i.exec(l.trim());if(!m)continue;
      v=m[3].trim();if(/QUOTED-PRINTABLE/i.test(m[2]))v=ctQP(v);k=m[1].toUpperCase();
      if(k==='TEL')add(v.replace(/^tel:/i,''));
      else if(k==='FN'){if(!fn)fn=v}
      else if(!nn)nn=v.split(';').map(function(x){return x.trim()}).filter(Boolean).join(' ')}
    name=tidy((fn||nn).replace(/\\([,;])/g,'$1').replace(/\\n/gi,' '));
  }else{
    var re=/\+?\d[\d \t\u00a0.\-()]{6,}\d/g;
    while((m=re.exec(s))){
      if(add(m[0]))hit.push(m[0]);
      else m[0].split(/[ \t\u00a0]+/).forEach(function(w){if(add(w))hit.push(w)})}
    rest=s;
    hit.forEach(function(h){rest=rest.replace(new RegExp('(?:(?:^|[\\s,;:|(\\[])(?:'+CTLB+')(?=[\\s:.\\-–])\\s*[:.\\-–]?\\s*)?'+ctRe(h),'i'),'\n')});
    name=rest.split('\n').map(tidy).filter(Boolean)[0]||'';
  }
  if(name.length>50||!/[A-Za-zÀ-ỹ]/.test(name))name='';   /* tên dài quá hoặc không có chữ nào (chỉ số) thì bỏ */
  return{name:name,tels:tels.slice(0,8)};
}

  if(!det){openModal('<h3>Máy này chưa tự đọc được ảnh mã QR</h3><p>Bạn chọn <b>Ngân hàng</b> rồi gõ <b>Số tài khoản</b> ngay bên dưới là được (chỉ làm 1 lần), sau đó quét thử mã QR hiện ra để chắc chắn đúng tên.</p><p class="hint">Đọc ảnh mã QR chạy được trên điện thoại Android mở bằng Chrome.</p>'+chromeBtn()+'<p class="hint diag">Thông tin máy: '+esc('Máy: '+osName()+' · Trình duyệt: '+brName())+'</p><div class="btns"><button class="btn pri" data-m="close">Đã hiểu</button></div>','qrimg');return}
  toast('Đang đọc ảnh mã QR…');
  function done(list){
    var p=null;(list||[]).some(function(x){p=parseVietQR(x&&x.rawValue);return !!p});
    if(!p){openModal('<h3>Ảnh này không có mã QR tài khoản ngân hàng</h3><p>Mở app ngân hàng của bạn → mục <b>Nhận tiền</b> hoặc <b>Mã QR của tôi</b> → lưu ảnh mã QR về máy (chụp màn hình cũng được), rồi bấm lại nút này và chọn ảnh đó.</p><div class="btns"><button class="btn pri" data-m="close">Đã hiểu</button></div>','qrimg');return}
    cfg.bankBin=p.bin;cfg.bankAcc=p.acc;cfg.bankSvc=p.svc;if(p.name)cfg.bankHolder=p.name;cfg.bank='';saveCfg();
    if(curTab==='cai')renderCai();
    toast('Đã lấy: '+(bankName(p.bin)||'ngân hàng mã '+p.bin)+' · '+p.acc+' — nhớ quét thử');
  }
  function fail(){toast('Không đọc được ảnh — thử ảnh khác rõ hơn')}
  function run(src){try{det.detect(src).then(done,fail)}catch(e){fail()}}
  function viaImg(){try{var u=URL.createObjectURL(f),im=new Image();im.onload=function(){run(im);setTimeout(function(){URL.revokeObjectURL(u)},4000)};im.onerror=function(){URL.revokeObjectURL(u);fail()};im.src=u}catch(e){fail()}}
  if(window.createImageBitmap)createImageBitmap(f).then(run,viaImg);else viaImg();
}

   '<div class="card"><h2>Hướng dẫn sử dụng</h2>'+
   '<details open><summary>Cân nhanh trong 3 bước</summary><ul><li>Ở thẻ <b>Cân</b>: bấm số kg, bấm <b>CỘNG MÃ</b>. Lặp lại cho từng lồng.</li><li>Sang thẻ <b>Tính tiền</b>: nhập giá. Gõ 62 máy tự hiểu là 62.000đ.</li><li>Sang thẻ <b>Phiếu</b>: lưu vào sổ, <b>chia sẻ ảnh phiếu</b> qua Zalo, hoặc <b>in phiếu</b>.</li></ul><p>Bàn phím số nhận ngay lúc ngón tay chạm xuống, bấm nhanh hai ngón liền nhau vẫn đủ số.</p></details>'+
   '<details><summary>Tài khoản · dùng thử · gia hạn · hỗ trợ</summary><p>Lần đầu mở app: bấm <b>Tạo tài khoản</b>, gõ email và mật khẩu (từ 6 ký tự). Tài khoản mới được <b>dùng thử miễn phí</b>, đủ mọi tính năng. Đã có tài khoản Sổ Nợ của cùng chủ phần mềm thì bấm <b>Đăng nhập</b> bằng đúng email và mật khẩu đó.</p><ul><li><b>Xem hạn dùng</b>: thẻ <b>Cài đặt</b> → khung <b>Tài khoản Cân Gà Pro</b> ở trên cùng. Sắp hết hạn thì app nhắc mỗi ngày 1 lần.</li><li><b>Gia hạn</b>: bấm <b>💳 Gia hạn</b> → chọn số tháng (gói 12 tháng có quà tặng khi chủ phần mềm đang khuyến mãi) → mở app ngân hàng quét mã QR (số tiền và nội dung đã điền sẵn, <b>giữ nguyên nội dung</b>) → bấm <b>✅ Tôi đã chuyển khoản</b>. Chủ phần mềm duyệt xong là app <b>tự mở</b>, không cần bấm gì thêm. Gia hạn sớm thì hạn mới cộng nối tiếp.</li><li><b>Hết hạn</b>: app hiện màn gia hạn; dữ liệu phiếu cân trên máy vẫn còn nguyên, gia hạn xong dùng tiếp.</li><li><b>Cần hỗ trợ, hoặc đã chuyển khoản mà app chưa mở</b>: bấm <b>💬 Nhắn chủ phần mềm</b> (trả lời hiện ngay trong app) hoặc gọi số hotline.</li><li><b>Đổi mật khẩu</b>: bấm <b>🔑 Đổi mật khẩu</b>. Quên mật khẩu: ở màn đăng nhập bấm <b>Quên mật khẩu</b>, app gửi thư đặt lại vào email (xem cả mục Spam).</li><li><b>Dữ liệu phiếu cân nằm trên máy này</b>, không nằm trong tài khoản. Đổi máy: ở máy cũ vào <b>Sao lưu dữ liệu</b> → <b>Tải file sao lưu</b> (hoặc Sao chép), sang máy mới đăng nhập rồi <b>Khôi phục</b>.</li><li>Mất mạng vẫn cân bình thường. App chỉ cần có mạng ít nhất 7 ngày một lần để kiểm tra hạn dùng.</li></ul></details>'+
   '<details><summary>Xoá hết để cân đợt mới</summary><p>Ở thẻ <b>Cân</b>, bấm nút đỏ <b>🗑 Xoá hết</b> ở đầu sổ cân. App hỏi lại trước khi xoá; phiếu chưa lưu thì chọn <b>Lưu vào Sổ rồi xoá</b> hoặc <b>Xoá, không lưu</b>.</p><p>Xoá hết là xoá <b>phiếu đang cân</b>: mọi mã cân, bì đã cân, tên khách, tiền cọc / tiền trả / nợ cũ. App <b>giữ lại</b> giá bán, cách trừ bì và toàn bộ phiếu đã lưu trong thẻ Sổ.</p><p>Lỡ tay xoá phiếu chưa lưu: bấm <b>↩ Lấy lại phiếu vừa xoá</b> hiện ngay trên màn hình cân (còn trong 24 giờ, cho tới lần xoá hết kế tiếp).</p></details>'+
   '<details><summary>Chia sẻ ảnh phiếu</summary><p>Ở thẻ <b>Phiếu</b> bấm <b>📷 Chia sẻ ảnh phiếu</b>: app tạo một tấm ảnh giống phiếu đang xem, có đủ sổ cân chia cột. Bấm <b>Chia sẻ ảnh</b> rồi chọn Zalo, hoặc bấm <b>Lưu ảnh</b> để lưu vào máy. Máy nào không cho chia sẻ thì chạm giữ vào ảnh để lưu.</p><p>Phiếu cũ trong thẻ <b>Sổ</b> cũng chia sẻ ảnh được. Nút <b>Sao chép gửi Zalo</b> vẫn còn nếu muốn gửi dạng chữ.</p></details>'+
   '<details><summary>In phiếu: A4/A5, máy in nhiệt, Bluetooth</summary><p>Ở thẻ <b>Phiếu</b> bấm <b>🖨 In phiếu</b> rồi chọn 1 trong 3 cách, giống phần in của app Sổ Nợ:</p><ul><li><b>Máy tính — Phiếu A4/A5</b>: in máy in thường hoặc lưu thành PDF. Chọn khổ A4 hay A5 ngay bên dưới nút.</li><li><b>In nhiệt qua trình duyệt (58/80mm)</b>: máy in nhiệt cắm USB / WiFi, AirPrint; chạy cả trên iPhone.</li><li><b>In máy in Bluetooth (nhiệt)</b>: máy in nhiệt cầm tay. Bấm <b>Kết nối / đổi máy in Bluetooth</b>, chọn tên máy in, chọn khổ 58mm hay 80mm rồi bấm in. Cần Chrome trên Android hoặc máy tính.</li></ul><p>Khổ giấy được nhớ cho lần sau. Phiếu cũ trong thẻ Sổ cũng in được.</p></details>'+
   '<details><summary>Lấy tên, số điện thoại từ danh bạ</summary><p>Ở thẻ <b>Tính tiền</b> bấm <b>📇 Lấy tên, số điện thoại khách từ danh bạ</b>. Ở thẻ <b>Cài đặt</b> bấm <b>📇 Lấy tên, số điện thoại từ danh bạ</b> để điền thông tin của mình. Danh bạ mở ra: <b>chạm vào tên người</b> (hiện dấu ✓) rồi bấm <b>Xong</b> ở góc trên bên phải — bấm nút quay lại là huỷ. Trên cùng danh bạ, để nút <b>Tên</b> và <b>Số điện thoại</b> sáng. App điền sẵn tên và số, ô vừa điền sáng lên; người có nhiều số thì app hỏi lấy số nào. Số dạng +84 được đổi về 0…</p><ul><li><b>Danh bạ mở ra rồi mà app vẫn không nhận được</b> (app báo “Chrome không nhận được người bạn chọn” hoặc “Danh bạ chưa gửi được ai về app”, dù quyền danh bạ đã bật): Chrome trên một số máy Android mới tự đóng danh bạ khi danh bạ của máy mở lên che app, app không sửa được. Dùng nút <b>📋 Dán số đã sao chép từ danh bạ</b> nằm ngay dưới nút danh bạ: mở app <b>Danh bạ</b> của máy → vào người cần lấy → <b>chạm giữ vào số điện thoại</b> → <b>Sao chép</b> → quay lại app, bấm nút 📋 → app đọc số vừa sao chép (máy hỏi cho phép thì bấm <b>Cho phép</b>; không đọc được thì chạm vào ô → <b>Dán</b>) → bấm <b>Lấy</b>. Dán cả “tên + số” hoặc cả thẻ liên hệ cũng được; người có nhiều số thì app hỏi lấy số nào. Nội dung dán chỉ có số thì gõ tên ở ô Tên.</li><li><b>Android</b>: phải mở app bằng <b>Chrome</b>. Trình duyệt <b>Samsung Internet</b>, Cốc Cốc, trình duyệt bên trong Zalo / Facebook không có chức năng này: bấm nút danh bạ, app hiện nút <b>🌐 Mở app này bằng Chrome</b>. Ngay dưới nút danh bạ, app cũng ghi rõ trình duyệt đang dùng có lấy được hay không.</li><li>Lần đầu máy hỏi “Cho phép Chrome truy cập danh bạ?” → bấm <b>Cho phép</b>. Lỡ bấm Từ chối: Cài đặt → Ứng dụng → Chrome → Quyền → Danh bạ → Cho phép.</li><li><b>iPhone</b>: chạm vào ô tên hoặc số → <b>Tự động điền</b> → <b>Liên hệ</b> → chọn người (iOS 17 trở lên). Hoặc bật 1 lần: <b>Cài đặt → Safari → Nâng cao → Tính năng thử nghiệm</b> (máy đời mới: Cài đặt → Ứng dụng → Safari → Nâng cao → <b>Feature Flags</b>) → bật <b>Contact Picker API</b>. Tên mục có thể khác chút tuỳ đời iPhone.</li></ul><p>Chưa lấy được thì cứ gõ tay như cũ.</p></details>'+
   '<details><summary>Mã QR chuyển khoản trên phiếu</summary><p>Cài 1 lần ở <b>Cài đặt → Tài khoản nhận tiền · mã QR</b>: chọn <b>Ngân hàng</b>, gõ <b>Số tài khoản</b> và tên chủ tài khoản. Nhanh hơn: bấm <b>📷 Lấy từ ảnh mã QR ngân hàng của mình</b> rồi chọn ảnh mã QR đã lưu từ app ngân hàng (chạy trên Android mở bằng Chrome).</p><p>Cài xong phải <b>quét thử</b> mã hiện ngay bên dưới bằng app ngân hàng (dùng điện thoại khác, hoặc chụp màn hình rồi trong app ngân hàng chọn quét từ ảnh): ra <b>đúng tên chủ tài khoản</b> thì mới dùng.</p><p>Từ đó mọi phiếu đều có mã QR: trên màn hình, ảnh chia sẻ, bản in A4/A5, in nhiệt, in Bluetooth. Lái mở app ngân hàng quét là ra sẵn số tài khoản, <b>số tiền</b> và <b>nội dung</b>. Số tiền trong mã là số <b>PHẢI THU</b>; khách đã trả một phần thì là số <b>CÒN NỢ</b>. Phiếu không còn phải thu thì không in mã.</p><p>Ở thẻ Phiếu <b>chạm vào mã QR</b> để phóng to cho lái quét. Mã được tạo ngay trên máy, không cần mạng, không gửi số tài khoản đi đâu.</p></details>'+
   '<details><summary>Nội dung chuyển khoản và thuế</summary><p>App tự ghi nội dung <b>BAN GA TU NUOI</b> + ngày cân (ví dụ <b>BAN GA TU NUOI 1311</b>). Muốn đổi thì sửa ô <b>Nội dung chuyển khoản</b> trong Cài đặt.</p><p><b>Nội dung chuyển khoản không quyết định có bị tính thuế hay không.</b> Cơ quan thuế xét bản chất của khoản tiền: chỉ tiền từ sản xuất, kinh doanh mới tính; tiền cho, tặng, vay mượn thì không. Ghi sai sự thật (ví dụ ghi “cho mượn”, “trả nợ” cho tiền bán gà) không né được thuế, cơ quan thuế còn coi đó là dấu hiệu gian lận; người chuyển cũng có thể dựa vào chữ “cho mượn” để đòi lại tiền.</p><p><b>Gà tự nuôi bán ra</b> (gà sống, chưa chế biến) thuộc diện <b>miễn thuế thu nhập cá nhân</b> và <b>không chịu thuế GTGT</b>, với điều kiện: chính mình trực tiếp nuôi, có đất / chuồng trại hợp pháp, và cư trú ở địa phương nơi nuôi. Vì vậy ghi đúng <b>BAN GA TU NUOI</b> và lưu phiếu cân trong thẻ <b>Sổ</b> chính là giấy tờ có lợi cho mình.</p><p><b>Mua gà về bán lại</b> là kinh doanh: hộ kinh doanh có doanh thu cả năm từ 1 tỷ đồng trở xuống không phải nộp thuế; trên mức đó phải kê khai. Nội dung chuyển khoản không thay đổi được điều này.</p><p class="hint">Theo Luật Thuế thu nhập cá nhân 2025, Nghị định 141/2026/NĐ-CP và Công văn 4568/TCT-DNNCN của Tổng cục Thuế. Trường hợp cụ thể nên hỏi thêm cơ quan thuế nơi mình ở.</p></details>'+
   '<details><summary>Đọc to số kg</summary><p>Bật <b>Đọc to số kg</b> ở mục Cách cân, chọn <b>Tốc độ đọc</b>, rồi bấm <b>🔊 Thử đọc</b>. Dòng chữ ngay bên dưới cho biết máy đang đọc bằng giọng nào, hoặc vì sao máy không đọc được.</p><p>App mượn giọng đọc có sẵn của điện thoại, nên <b>máy chưa có giọng tiếng Việt thì không đọc được</b>; khi đó app kêu “bíp” thay cho đọc. Cách cài giọng:</p><ul><li><b>Máy Android</b>: mở Cài đặt của điện thoại, gõ tìm “chuyển văn bản” → mở mục <b>Chuyển văn bản sang lời nói</b> (có máy ghi “thành giọng nói”) → chọn công cụ của <b>Google</b> → bấm hình bánh răng → <b>Cài đặt dữ liệu thoại</b> → chọn <b>Tiếng Việt</b> để tải về.</li><li><b>iPhone</b>: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Việt.</li><li>Đang mở app bên trong <b>Zalo / Facebook</b>: bấm dấu ⋮ (hoặc ···) rồi chọn mở bằng trình duyệt Chrome hoặc Safari.</li></ul><p>Cài xong quay lại app, bấm <b>Thử đọc</b>. Tên mục trong Cài đặt có thể hơi khác tuỳ hãng máy.</p></details>'+
   '<details><summary>Sổ cân chia cột 5 mã để đối chiếu với lái</summary><p>Mỗi cột có đúng 5 mã cân theo thứ tự từ trên xuống, số nhỏ ở góc là số thứ tự mã. Dòng cuối mỗi cột là <b>cộng cột</b>. Khi lái đọc sổ của họ, hai bên chỉ cần so cộng từng cột; cột nào lệch thì dò 5 số trong cột đó.</p><p>Bấm <b>Ẩn phím</b> để xem được nhiều cột hơn. Chạm vào một số để sửa hoặc xoá. Số màu cam là mã nặng nhẹ khác thường, nên xem lại.</p></details>'+
   '<details><summary>Chọn cách trừ bì (nằm chung một chỗ)</summary><p>Ở thẻ Cân bấm nút màu vàng <b>Bì… ▸</b> (hoặc nút <b>Cách trừ bì</b> ở thẻ Tính tiền). Chọn 1 trong 5 cách:</p><ul><li><b>Không trừ bì</b>.</li><li><b>Trừ theo mã cân</b>: mỗi mã trừ bao nhiêu kg, máy tự nhân với số mã.</li><li><b>Trừ theo số lồng</b>: số lồng × kg mỗi lồng.</li><li><b>Cân bì rỗng thực tế</b>: bấm “Cân bì rỗng ngay”, cân các lồng rỗng, xong bấm “Xong, cân gà tiếp”.</li><li><b>Nhập thẳng tổng kg bì</b>.</li></ul><p>Cũng trong bảng đó có <b>Trừ hao %</b>, <b>Trừ gam/con</b> và <b>Trừ thêm kg</b>. Kết quả hiện ngay bên dưới để hai bên cùng xem. Cách trừ bì được nhớ cho phiếu sau.</p></details>'+
   '<details><summary>Kết nối cân Bluetooth</summary><p>Bấm <b>Cân Bluetooth</b> ở thẻ Cân, rồi <b>Kết nối cân Bluetooth</b> và chọn tên cân. Nếu không thấy số nhảy, thử <b>Kết nối kiểu Serial</b> (cân Bluetooth đời cũ phải ghép đôi trong Cài đặt điện thoại trước).</p><p>Khi đã nối: mặt cân trong app hiện đúng số trên cân. Cân <b>đứng số</b> thì app tự chốt thành một mã và kêu bíp, phải nhấc lồng ra thì mới chốt mã kế. Tắt “Tự chốt” nếu muốn tự bấm <b>CHỐT MÃ</b>.</p><p>Cần Chrome trên Android hoặc máy tính; iPhone không hỗ trợ. Muốn xem thử trước khi có cân: bấm <b>Chạy thử bằng cân giả lập</b>. Nếu cân lạ không ra số, mở mục <b>Dữ liệu thô</b>, sao chép và gửi cho người làm app để chỉnh.</p></details>'+
   '<details><summary>Số con</summary><p>Chạm ô <b>Số con / mã</b> trên mặt cân, bấm số, rồi bấm nút đỏ <b>XONG SỐ CON</b> để quay lại bấm số cân. Số này được giữ cho các mã sau (mở lại app vẫn còn), chỉ sửa khi lồng khác đi. Chạm vào ô rồi bấm số mới là số cũ được thay luôn.</p><p>App dùng số con để tính kg bình quân mỗi con. Nếu số con trông sai so với số cân (ví dụ bấm nhầm thành 2018 con, hoặc lồng lẻ ít con mà quên đổi) app sẽ <b>hỏi lại</b> trước khi cộng. Mã nào chưa có số con thì phiếu ghi rõ, bình quân chỉ tính trên các mã có số con.</p></details>'+
   '<details><summary>Bán nhiều loại gà khác giá</summary><p>Ở thẻ Tính tiền bấm <b>Thêm loại gà khác giá</b>. Quay lại thẻ Cân sẽ có các nút chọn loại, chọn loại nào thì mã cân vào sổ của loại đó. Mỗi loại có cách trừ bì riêng.</p></details>'+
   '<details><summary>Nợ cũ, công nợ và đàn gà</summary><p>Gõ đúng tên khách đã từng lưu phiếu, máy tự nhắc số còn nợ ở phiếu trước để cộng vào. Thẻ <b>Sổ</b> cho biết doanh số hôm nay, 7 ngày, tháng này và tổng khách đang nợ.</p><p>Nếu đã lưu đàn gà bên quy trình nuôi, ở thẻ Tính tiền chọn <b>Bán từ đàn</b> để phiếu ghi tên đàn, ngày tuổi, và thẻ Cân báo còn bao nhiêu con chưa cân.</p></details></div>';
  h+='<div class="hint" id="cgVer">Phiên bản Cân Gà Pro: '+CG_VER+'</div>';
  $('#tab-cai').innerHTML=h;
}

}

/* BÀN PHÍM SỐ — cho nhạy:
   · nhận phím ngay lúc ngón tay CHẠM xuống, không chờ nhấc tay (cách cũ dùng “click”: ngón hơi trượt, hoặc ngón sau chạm khi ngón trước chưa nhấc, là mất phím);
   · chạm trúng khe hở giữa hai phím vẫn nhận phím gần nhất;
   · phím nháy sáng + rung nhẹ ngay khi nhận. */
var padEl=$('#pad'),PAD_PE=!!window.PointerEvent,PAD_TE=('ontouchstart' in window),padAt=0,padKey=null;
function keyAt(x,y){
  var best=null,bd=1e9;
  Array.prototype.forEach.call(padEl.children,function(b){var r=b.getBoundingClientRect();if(!r.width||!r.height)return;
    var dx=x<r.left?r.left-x:(x>r.right?x-r.right:0),dy=y<r.top?r.top-y:(y>r.bottom?y-r.bottom:0),d=dx*dx+dy*dy;if(d<bd){bd=d;best=b}});
  return bd<=256?best:null;
}
function padHit(b){
  if(!b||!b.dataset||!b.dataset.k)return;
  var now=Date.now();if(b===padKey&&now-padAt<40)return;      /* hai điểm chạm gần như cùng lúc trên MỘT phím (tay ướt, ngón tay + mép bàn tay): chỉ tính 1 lần. Người bấm lại cùng một phím nhanh nhất cũng cách nhau trên 80 ms nên không bị mất số. */
  padKey=b;padAt=now;
  b.classList.add('on');setTimeout(function(){b.classList.remove('on')},120);
  if(b.dataset.k!=='add'){try{if(navigator.vibrate)navigator.vibrate(10)}catch(e){}}
  press(b.dataset.k);
}
function padDown(t,x,y){var b=t&&t.closest?t.closest('button'):null;if(!b||b.parentNode!==padEl)b=keyAt(x,y);padHit(b)}
if(PAD_PE)padEl.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;padDown(e.target,e.clientX,e.clientY)});
else if(PAD_TE)padEl.addEventListener('touchstart',function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];padDown(document.elementFromPoint(t.clientX,t.clientY),t.clientX,t.clientY)}},{passive:true});
/* phím đã nhận lúc chạm xuống rồi: chặn cú “click” trình duyệt sinh thêm khi nhấc tay (nếu không, nó có thể rơi trúng nút của hộp hỏi vừa hiện ra ngay dưới ngón tay) */
padEl.addEventListener('touchend',function(e){if(e.cancelable)e.preventDefault()},{passive:false});
/* “click” chỉ còn dùng khi bấm bằng bàn phím máy tính (Enter/Space trên nút) hoặc trình duyệt quá cũ không có sự kiện chạm */
padEl.addEventListener('click',function(e){if((PAD_PE||PAD_TE)&&(e.detail!==0||Date.now()-padAt<700))return;var b=e.target.closest('button');if(b&&b.parentNode===padEl)press(b.dataset.k)});

  else if(m==='hedit'){var r2=hist.filter(function(x){return x.id===id})[0];if(!r2)return;

  else if(m==='himg'||m==='hprint'){var r3=hist.filter(function(x){return x.id===id})[0];if(r3){if(m==='himg')openShare(r3.state);else openPrint(r3.state)}}
  else if(m==='clrsave')doClearAll(true);

  else if(m==='prsz'){cfg.prSize=b.dataset.v==='A5'?'A5':'A4';saveCfg();openPrint(PR.st)}

  else if(m==='prcon'){if(PR.busy){toast('⏳ Đang in — chờ in xong');return}prConnect().then(function(){if(modalKind==='print')openPrint(PR.st)})}
  else if(m==='prbt')prBluetooth(PR.st);
  else if(m==='ctpick'){var ctel=CT.tels[+b.dataset.i],ccb=CT.cb;closeModal();if(ccb&&ctel)ccb(CT.name,ctel)}
  else if(m==='ctagain'){var acb=CT.cb;closeModal();if(acb)pickContact(acb)}

});
function modalField(e){

}

/* ─────────── DÙNG THỬ: khoá hộp thư rồi tạo giấy phép thử ─────────── */
async function giuKhoa(){
  const u = G.u, k = hopThuThat(u.email); if(!k || k.indexOf("/") >= 0) return "loi";
  const ref = doc(db, "trialKeys", k);
  try{ await setDoc(ref, { uid:u.uid, at:serverTimestamp() }); return "ok"; }
  catch(e){
    if(!e || e.code !== "permission-denied") return "mang";
    try{ const s = await getDoc(ref); if(s.exists() && (s.data() || {}).uid === u.uid) return "ok"; }
    catch(e2){ if(!e2 || e2.code !== "permission-denied") return "mang"; }
    if((G.cfg || {}).thuXacMinh === true && !u.emailVerified) return "xacminh";
    return "khac";
  }
}
async function moDungThu(){
  if(G.dangThu || G.thuXong || !G.u || laAdmin()) return;
  G.dangThu = true; const u = G.u;
  moCong(veCho("Đang mở dùng thử miễn phí…"), "cho");
  let ly = "";
  try{
    const coMang = await napBill();
    const c = G.cfg || {};
    if(!coMang && !Object.keys(c).length && navigator.onLine === false) ly = "mang";
    else if(c.choThu === false) ly = "tatthu";
    else if(/\+[^@]*@/.test(String(u.email || "")) && c.chanBiDanh !== false) ly = "bidanh";
    else if(c.thu1May !== false && mayCoTaiKhoanKhac(u.uid)) ly = "may";
    else{
      if(c.motThuMoiHop !== false || c.thuXacMinh === true){ const k = await giuKhoa(); if(k !== "ok") ly = k; }
      if(!ly){
        const d0 = new Date(nowEff()); d0.setDate(d0.getDate() + ngayThu()); d0.setHours(23, 59, 0, 0);
        try{ await setDoc(doc(db, "accounts", u.uid, "lic", APP), { trial:true, trialUsed:true, active:true, paidUntil:d0, startedAt:new Date() }); }
        catch(e){ ly = (e && e.code === "permission-denied") ? "tuchoi" : "mang"; if(ly === "tuchoi") baoLoi(e, "Mở dùng thử Cân Gà bị máy chủ chối"); }
      }
    }
  }catch(e){ ly = "mang"; }
  G.dangThu = false;
  if(G.u !== u) return;
  if(!ly){ G.thuXong = true; G.thuLy = ""; toast("🎁 Đã mở " + ngayThu() + " ngày dùng thử — chúc bán đắt!", 4000); return; }
  G.thuLy = ly;
  if(ly === "mang" || ly === "loi"){ G.thuXong = false; return hienCanMang("thu"); }
  G.thuXong = true;
  if(ly === "xacminh") return hienXacMinh(true);
  danhGia();
}

/* ─────────── XÉT HẠN ⇒ MỞ APP / CHE LẠI ─────────── */
function danhGia(){
  if(!G.u) return;
  const st = stHienTai(); if(!st) return;
  if(ST.con(st)) return moApp(st);
  if(G.ln === null && (G.dangThu || !G.thuXong)) return;          /* đang mở dùng thử */
  khoa(st);
}
async function khoa(st){
  /* Công tắc "Bắt buộc giấy phép" của app Quản Trị đang TẮT (billing/config.enforce = false) ⇒ cả hệ dùng miễn phí */
  if(G.cfg == null) await napBill();
  if(!G.u) return;
  if(G.cfg && G.cfg.enforce === false) return moApp(st, true);
  G.mo = false; clearTimeout(G.henHet);
  if(G.cong === "giahan" || G.cong === "xacminh") { if(G.cong === "giahan" && G.veGH !== moTaSt(st)) veGiaHan(); return; }
  G.tuNguyen = false; hienGiaHan(false);
}
function moApp(st, mien){
  const truoc = G.mo; G.mo = true;
  luuGP();
  if(congMo()){
    if(G.cong === "giahan" && G.tuNguyen){ if(G.veGH !== moTaSt(st)) veGiaHan(); }
    else dongCong();
  }
  if(!truoc) G.daBaoCK = false;
  henHet(st); capNhatThe(); if(!mien) nhacHan(st);
}
function henHet(st){
  clearTimeout(G.henHet);
  if(!st || !st.han || (st.ma !== "thu" && st.ma !== "tra")) return;
  const ms = st.han - nowEff() + 800;
  if(ms > 0 && ms < 2147000000) G.henHet = setTimeout(danhGia, ms);
}
function baoDoiHan(truoc){
  const sau = stHienTai(); if(!truoc || !sau) return;
  if(ST.con(truoc) && ST.con(sau) && sau.han && truoc.han && sau.han > truoc.han + N / 2)
    toast("✅ Đã gia hạn Cân Gà Pro tới " + ngayVN(sau.han) + ". Cảm ơn bạn!", 5000);
  else if(!ST.con(truoc) && ST.con(sau) && sau.ma !== "thu") toast("✅ Cân Gà Pro đã mở" + (sau.han ? " — hạn tới " + ngayVN(sau.han) : "") + ". Cảm ơn bạn!", 5000);
}
/* Mỗi ngày nhắc 1 lần khi sắp hết hạn: gói trả tiền còn ≤ 7 ngày, dùng thử còn ≤ 3 ngày */
function nhacHan(st){
  if(!st || !G.u) return;
  const sap = (st.ma === "tra" && st.con <= 7) || (st.ma === "thu" && st.con <= 3);
  if(!sap || congMo() || $("#cgp-mask")) return;
  const d = new Date(nowEff()), k = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() + "|" + G.u.uid;
  if(LS(K.nhac, "") === k) return;
  LSet(K.nhac, k);
  moMask("<h4>⏰ " + (st.ma === "thu" ? "Sắp hết dùng thử" : "Sắp hết hạn") + "</h4><p>" + esc(moTaSt(st)) + ". Gia hạn sớm thì hạn mới được <b>cộng nối tiếp</b>, không mất ngày nào.</p>"
    + '<button type="button" class="cgp-b pri" data-cgp="giahan">💳 Gia hạn ngay</button><button type="button" class="cgp-b" data-cgp="dongmask">Để sau</button>', "nhac");
}

  veGiaHan();
  napBill().then(() => { if(G.cong === "giahan") veGiaHan(); });

function kv(nhan, gt, chep){

function kmHtml(unit, m){
  const b = thangTang(m); if(b <= 0 || !(unit > 0)) return "";
  const full = unit * m, tra = giaGiaHan(unit, m);
  return '<div class="cgp-km">🎁 Gói ' + m + " tháng: tặng " + b + " tháng — chỉ trả tiền " + thangTinhTien(m) + " tháng · tiết kiệm " + tien(full - tra) + " <s>" + tien(full) + "</s></div>";
}
function veGiaHan(){

      + nutLienHe() + '<button type="button" class="cgp-b" data-cgp="kiemtra">🔄 Kiểm tra lại</button>' + nutThoat();
    moCong(h, "giahan"); return;

  else if(st.ma === "trong" || st.ma === "sai") h += '<div class="cgp-bao v">Tài khoản chưa được đặt hạn dùng. Gia hạn bên dưới, hoặc nhắn chủ phần mềm.</div>';
  const unit = donGia(), b = nganHang(), m = THANG.indexOf(G.thang) >= 0 ? G.thang : 1, tong = giaGiaHan(unit, m), noi = (u.email || "") + " " + APP;

    h += '<div class="cgp-tong">Tổng: <b>' + tien(tong) + "</b> <small>(" + tien(unit) + "/tháng)</small></div>" + kmHtml(unit, m)

      + kv("🏦 Ngân hàng", b.nh || b.bin) + kv("🔢 Số TK", b.acc, b.acc) + kv("👤 Chủ TK", b.ten) + kv("💰 Số tiền", tien(tong), String(tong)) + kv("📝 Nội dung", noi, noi)
      + '<div class="cgp-bao v" style="margin-bottom:0">⚠️ Giữ <b>nguyên nội dung</b> khi chuyển khoản để chủ phần mềm mở đúng tài khoản. Chuyển xong bấm nút xanh.</div>'

  }

  h += con ? '<button type="button" class="cgp-b" data-cgp="dong">← Quay lại app</button>' : '<button type="button" class="cgp-b" data-cgp="kiemtra">🔄 Kiểm tra lại</button>';

}
/* Đơn gia hạn: ghi khi mã QR hiện ra (máy chủ SePay / app Quản Trị khớp tiền về với đơn chờ), thêm cờ ck khi khách bấm "Đã chuyển" */
async function ghiDon(daCK){
  const u = G.u; if(!u || laAdmin()) return;
  const unit = donGia(), m = THANG.indexOf(G.thang) >= 0 ? G.thang : 1, tong = giaGiaHan(unit, m);
  if(!(tong > 0)){ if(daCK) toast("Chưa có giá gói — gọi " + hotTxt()); return; }
  const khoa = m + "|" + tong;
  if(!daCK && khoa === G.donCuoi) return;
  const d = { uid:u.uid, app:APP, email:u.email || "", months:m, amount:tong, noiDung:(u.email || "") + " " + APP,
              requestedAt:serverTimestamp(), status:"pending", handledAt:null };
  if(daCK) d.ck = { luc:serverTimestamp(), thang:m, tien:tong };
  if(!daCK) G.donCuoi = khoa;
  try{
    await setDoc(doc(db, "renewalRequests", u.uid + "__" + APP), d, { merge:true });
    if(daCK){ G.daBaoCK = true; toast("✅ Đã báo chủ phần mềm: bạn đã chuyển " + tien(tong) + ". App tự mở khi được duyệt.", 5000); if(G.cong === "giahan") veGiaHan(); }
  }catch(e){
    if(!daCK) G.donCuoi = "";
    if(daCK) toast("❌ Chưa gửi được — kiểm tra mạng rồi bấm lại", 4500);
  }
}
async function kiemTraLai(btn){

  try{
    const s = await getDoc(doc(db, "accounts", G.u.uid, "lic", APP));
    const truoc = stHienTai();
    G.ln = s.exists() ? licNho(s.data() || {}) : null; G.lnMC = true; luuGP();
    const sau = stHienTai();
    if(ST.con(sau)){ baoDoiHan(truoc); danhGia(); return; }
    toast(G.daBaoCK ? "Chủ phần mềm chưa duyệt — duyệt xong app tự mở, không cần bấm" : "Chưa thấy gia hạn trên máy chủ", 4500);
    danhGia();
  }catch(e){ toast("Cần có mạng để kiểm tra", 4000); }

/* ─────────── NGHE GIẤY PHÉP + TÀI KHOẢN (1 lượt đọc lúc mở + 1 lượt mỗi lần Quản Trị đổi) ─────────── */
function dungNghe(){
  try{ if(G.huyLic) G.huyLic(); }catch(e){} try{ if(G.huyAcc) G.huyAcc(); }catch(e){}
  G.huyLic = G.huyAcc = null; clearTimeout(G.henLic); clearTimeout(G.henHet);
}
function ngheLic(){
  const u = G.u; let coMC = false;
  G.henLic = setTimeout(() => { if(!coMC && G.u === u) khongCoMang(); }, 9000);
  G.huyLic = onSnapshot(doc(db, "accounts", u.uid, "lic", APP), { includeMetadataChanges:true }, s => {
    if(G.u !== u || s.metadata.fromCache || s.metadata.hasPendingWrites) return;   /* chỉ tin lời MÁY CHỦ */
    coMC = true; clearTimeout(G.henLic);
    const truoc = stHienTai();
    G.ngoaiTuyen = false; G.lnMC = true;
    if(!s.exists()){ G.ln = null; luuGP(); if(!G.thuXong) moDungThu(); else danhGia(); return; }
    G.ln = licNho(s.data() || {}); G.thuLy = "";
    luuGP(); danhGia(); baoDoiHan(truoc);
  }, e => { if(G.u === u && !coMC) khongCoMang(); });
}
function khongCoMang(){
  if(!G.u || G.lnMC) return;
  G.ngoaiTuyen = true;
  const gp = LS(K.gp, null);
  if(gp && gp.uid === G.u.uid && gp.l !== undefined){
    const ver = Number(gp.ver) || 0;
    if(Date.now() < ver - 2 * 3600e3) return hienCanMang("lui");
    if(nowEff() - (Number(gp.ok) || 0) > 7 * N) return hienCanMang("lau");
    G.ln = gp.l || null; G.thuXong = true;
    return danhGia();
  }
  hienCanMang("dau");
}
function ngheAcc(){
  const u = G.u;
  G.huyAcc = onSnapshot(doc(db, "accounts", u.uid), s => {
    if(G.u !== u || s.metadata.fromCache || s.metadata.hasPendingWrites) return;
    if(!s.exists()){ G.acc = {}; taoAcc(); } else G.acc = s.data() || {};
    xuLyTuXa();
    if(G.cong === "giahan") veGiaHan();
    capNhatThe();
  }, e => {});
}
async function taoAcc(){
  if(G.daTaoAcc || !G.u) return; G.daTaoAcc = true;
  try{ await setDoc(doc(db, "accounts", G.u.uid), { email:G.u.email || "", createdAt:serverTimestamp() }); }catch(e){}
}

/* ─────────── GIỜ MÁY: lấy giờ thật từ máy chủ trang (chống vặn lùi giờ để dùng tiếp khi hết hạn) ─────────── */
async function kiemGio(){
  if(G.dangGio || !/^https?:$/.test(location.protocol)) return;
  G.dangGio = true;
  try{
    const t0 = Date.now();
    const r = await fetch(location.href.split("#")[0], { method:"HEAD", cache:"no-store", credentials:"omit" });
    const t1 = Date.now(), d = Date.parse(r.headers.get("date") || "");
    if(!isNaN(d) && t1 - t0 < 15000){
      let sk = (t0 + t1) / 2 - d; if(Math.abs(sk) < 120000) sk = 0;      /* lệch dưới 2 phút: bỏ qua */
      G.skew = sk; G.lucGio = Date.now(); G.ver = Math.max(G.ver || 0, d);
      const gp = LS(K.gp, null); if(gp && G.u && gp.uid === G.u.uid){ gp.ver = Math.max(Number(gp.ver) || 0, d); LSet(K.gp, gp); }
      danhGia();
    }
  }catch(e){}
  finally{ G.dangGio = false; }
}

/* ─────────── TIN TỪ XA (accounts/{uid}.remote — Quản Trị ghi, khách chỉ đọc) ─────────── */
const docXem = () => LS(K.xem, {}) || {};
const ghiXem = v => LSet(K.xem, v);
function thanh(loai, text, nhan, onNhan, choTat, onTat){
  xoaThanh();
  const d = document.createElement("div"); d.id = "cgp-bar"; d.className = loai;
  d.innerHTML = '<div class="t">' + esc(text) + "</div>" + (nhan ? '<button type="button" data-r="ok">' + esc(nhan) + "</button>" : "") + (choTat ? '<button type="button" class="x" data-r="x" aria-label="Đóng">✕</button>' : "");
  document.body.appendChild(d);
  d.addEventListener("click", e => { const b = e.target.closest ? e.target.closest("[data-r]") : null; if(!b) return;
    if(b.getAttribute("data-r") === "ok"){ if(onNhan) onNhan(); } else { xoaThanh(); if(onTat) onTat(); } });
}
function xoaThanh(loai){ const e = $("#cgp-bar"); if(e && (!loai || e.className === loai)) e.remove(); }
function xuLyTuXa(){
  try{
    const r = (G.acc && G.acc.remote) || {}, xem = docXem();
    if(r.logout && r.logout.id && r.logout.at) dangXuatNeuCu(r.logout);
    if(r.reload && r.reload.id && xem.rl !== r.reload.id){
      thanh("rl", "✨ Có bản mới của Cân Gà Pro — bấm Cập nhật (phiếu đang cân vẫn giữ nguyên)", "Cập nhật ngay", () => {
        const v = docXem(); v.rl = r.reload.id; ghiXem(v); capNhatApp(); }, false);
      return;
    }
    if(!(r.reload && r.reload.id) && xem.rl){ delete xem.rl; ghiXem(xem); }
    xoaThanh("rl");
    const m = r.msg;
    if(!m || !m.id || !m.text){ xoaThanh("tin"); const mk = $("#cgp-mask"); if(mk && mk.getAttribute("data-k") === "tin") mk.remove(); }
    else if(xem.msg !== m.id){
      if(m.muc === "warn"){
        /* khách đang mở hộp thoại (đang gõ tin hỗ trợ, đổi mật khẩu…) ⇒ KHÔNG đè lên làm mất chữ; đóng hộp thoại là hiện ngay (dongMask soát lại) */
        if(!$("#cgp-mask")) moMask("<h4>📢 Thông báo từ chủ phần mềm</h4><p class=\"cgp-tx\">" + esc(m.text) + '</p><button type="button" class="cgp-b pri" data-cgp="daxemtin" data-id="' + esc(m.id) + '">Đã hiểu</button>', "tin");
      }else thanh("tin", "📢 " + m.text, "", null, true, () => { const v = docXem(); v.msg = m.id; ghiXem(v); });
    }
    const h = r.hotro;
    if(h && h.id && HT.tid === h.id && $("#cgp-htb") && coTraLoi()) daXemTraLoi();   /* đang mở đúng cuộc đó ⇒ đã thấy trả lời ngay trên màn */
    if(h && h.id && coTraLoi() && !$("#cgp-mask") && !$("#cgp-bar"))
      thanh("ht", "💬 Chủ phần mềm đã trả lời tin nhắn của bạn", "Xem", () => { xoaThanh(); moHopThu(); }, true, () => { daXemTraLoi(); });
  }catch(e){}
}
function coTraLoi(){
  const h = G.acc && G.acc.remote && G.acc.remote.hotro; if(!h || !h.id) return false;
  const da = LS(K.ht, {}) || {}; return (Number(h.n) || 0) > (Number(da[h.id]) || 0);
}
function daXemTraLoi(){
  const h = G.acc && G.acc.remote && G.acc.remote.hotro; if(!h || !h.id) return;
  const da = LS(K.ht, {}) || {}; da[h.id] = Number(h.n) || 0; LSet(K.ht, da); capNhatThe();
}
async function dangXuatNeuCu(lo){
  if(G.dx || !G.u) return;
  const luc = msOf(lo.at); if(!luc) return;
  let phien = 0; try{ const r = await G.u.getIdTokenResult(); phien = Date.parse((r && r.authTime) || ""); }catch(e){ phien = 0; }
  if(!phien || isNaN(phien) || phien >= Math.floor(luc / 1000) * 1000 || G.dx) return;   /* giờ đăng nhập của Firebase chỉ tính tới giây */
  G.dx = true;
  try{ alert("🔐 Chủ phần mềm yêu cầu đăng nhập lại trên máy này.\n\nBấm OK rồi đăng nhập bằng email + mật khẩu của bạn. Dữ liệu phiếu cân vẫn còn nguyên."); }catch(e){}
  await dangXuat();
  try{ location.reload(); }catch(e){}
}
async function capNhatApp(){
  try{ const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(r){ await r.update(); if(r.waiting) r.waiting.postMessage("capNhat"); } }catch(e){}
  try{ const c = await caches.keys(); const sc = location.origin + location.pathname.replace(/[^/]*$/, ""); await Promise.all(c.filter(k => k.indexOf("vo-") === 0 && k.slice(-sc.length) === sc).map(k => caches.delete(k))); }catch(e){}
  setTimeout(() => { try{ location.reload(); }catch(e){} }, 300);
}

/* ─────────── HỘP THOẠI CHUNG ─────────── */

/* ─────────── HỘP THƯ HỖ TRỢ (hotro — y khuôn Sổ Nợ, Quản Trị 5.1 trả lời) ─────────── */

function moTaLoiHT(e){

  if(/permission-denied/.test(c)) return "Hộp thư chưa mở trên máy chủ. Gấp thì gọi " + hotTxt() + ".";
  if(/unavailable|network|offline/i.test(c + m) || navigator.onLine === false) return "Máy đang mất mạng — có mạng lại rồi thử lại nhé.";
  return "Chưa gửi / tải được (" + (c || m).slice(0, 60) + "). Gấp thì gọi " + hotTxt() + ".";
}
function hopDen(){

function veCuoc(){

async function guiHT(btn){
  if(HT.dang || !G.u) return;
  const ta = $("#cgp-noi"); let noi = String((ta && ta.value) || "").trim();
  if(!noi){ if(ta) ta.focus(); return; }
  noi = noi.slice(0, 1500);
  const u = G.u, tid = HT.tid;
  HT.dang = true; HT.loi = ""; HT.bao = ""; if(btn){ btn.disabled = true; btn.textContent = "Đang gửi…"; }
  try{
    const bt = writeBatch(db), tin = { tu:"k", noi, at:serverTimestamp(), nguoi:u.uid, build:APP_VER, hd:hopDen() };
    let id = tid;
    if(!tid){
      const tRef = doc(collection(db, "hotro")); id = tRef.id;
      bt.set(tRef, { uid:u.uid, tu:u.uid, email:String(u.email || "").slice(0, 120), ten:String(u.email || "").split("@")[0].slice(0, 80),
        tieuDe:("[Cân Gà Pro] " + noi.replace(/\s+/g, " ")).slice(0, 120), tt:"mo", moiKhach:true, moiQT:false,
        cap:serverTimestamp(), tao:serverTimestamp(), n:1, build:APP_VER });
      bt.set(doc(collection(db, "hotro", id, "tin")), tin);
    }else{
      bt.set(doc(collection(db, "hotro", tid, "tin")), tin);
      bt.update(doc(db, "hotro", tid), { moiKhach:true, moiQT:false, tt:"mo", cap:serverTimestamp(), n:increment(1) });
    }
    await bt.commit();
    HT.dang = false; if(ta) ta.value = "";
    if(!tid){
      HT.ds.unshift({ id, tieuDe:("[Cân Gà Pro] " + noi).slice(0, 120), tt:"mo", moiQT:false, cap:Date.now(), n:1 });
      HT.bao = "✅ Đã gửi — chủ phần mềm trả lời ở ngay đây, app sẽ báo khi có trả lời.";
      moCuoc(id);
    }else{ const t = HT.ds.find(x => x.id === tid); if(t){ t.tt = "mo"; t.moiQT = false; } if(btn){ btn.disabled = false; btn.textContent = "📨 Gửi"; } }
  }catch(e){
    HT.dang = false; HT.loi = moTaLoiHT(e);
    if(btn){ btn.disabled = false; btn.textContent = tid ? "📨 Gửi" : "📨 Gửi cho chủ phần mềm"; }
    if(!tid) veMoiHT(noi); else veCuoc();
  }
}
